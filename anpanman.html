<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>휴게시간 순서뽑기 - 호빵맨 테마</title>
    <!-- Pretendard 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
    <style>
        :root {
            --primary: #82DC28;
            --primary-hover: #72c722;
            --coral: #FF7878;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #2b3a2a;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* 모바일 컨테이너 (세로형 초원 배경) */
        .mobile-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 100vh;
            background: linear-gradient(180deg, #b8e2f2 0%, #dcf0f9 26%, #cde6ba 26.2%, #c9e3b4 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,0.3);
        }

        /* 배경 산 능선 & 수풀 레이어 */
        .scenery-layer {
            position: absolute;
            top: 14%;
            left: 0;
            width: 100%;
            height: 14%;
            pointer-events: none;
            z-index: 0;
        }

        /* 상단 헤더 */
        header {
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            z-index: 20;
        }

        .nav-btn {
            background: #f1f5f9;
            border: none;
            padding: 7px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            transition: transform 0.15s ease;
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .header-title {
            font-size: 1.08rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .sound-btn {
            background: #f1f5f9;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 1.05rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 명대사 플로팅 말풍선 배너 */
        .quote-toast {
            position: absolute;
            top: 68px;
            left: 50%;
            transform: translateX(-50%) translateY(-15px);
            width: calc(100% - 36px);
            background: rgba(255, 255, 255, 0.96);
            border: 2.5px solid var(--coral);
            border-radius: 18px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14);
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .quote-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .quote-speaker {
            background: var(--coral);
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 800;
            padding: 4px 9px;
            border-radius: 10px;
            white-space: nowrap;
        }

        .quote-text {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.3;
            word-break: keep-all;
        }

        /* 페이지 전환 레이어 */
        .page {
            position: absolute;
            top: 56px;
            left: 0;
            width: 100%;
            height: calc(100% - 56px);
            display: flex;
            flex-direction: column;
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 1;
            z-index: 2;
        }

        .page.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
            z-index: 1;
        }

        /* 컨텐츠 스크롤 영역 */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px 110px 18px;
        }

        /* 3x4 격자 그리드 (12개 캐릭터) */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        /* 하얀 바탕 1:1 라운드 정사각형 카드 */
        .char-card {
            background: #ffffff;
            border-radius: 20px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 8px 7px 8px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
            border: 3.5px solid transparent;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .char-card:active {
            transform: scale(0.94);
        }

        .char-card.selected {
            border-color: var(--primary);
            box-shadow: 0 8px 18px rgba(130, 220, 40, 0.38);
            transform: translateY(-3px);
        }

        /* 선택 체크 뱃지 */
        .select-check {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary);
            color: #1e293b;
            font-size: 0.75rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.18);
            z-index: 4;
        }

        .char-card.selected .select-check {
            opacity: 1;
            transform: scale(1);
        }

        /* poster.jpeg 스프라이트 크롭 박스 (4열 x 3행 중 일러스트 영역만 확대 크롭) */
        .poster-sprite {
            width: 100%;
            height: 78%;
            border-radius: 13px;
            background-image: url('poster.jpeg');
            background-repeat: no-repeat;
            /* 4열 3행 중 하단 일본어/영어 텍스트가 잘리고 캐릭터 일러스트만 꽉 차게 보이도록 배율 조정 */
            background-size: 425% 385%;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
        }

        .char-name {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-main);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            margin-top: 2px;
        }

        /* 결과 화면 우측 상단 겹침 알파벳 배지 */
        .result-badge {
            position: absolute;
            top: -9px;
            right: -9px;
            background: var(--coral);
            color: #ffffff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 900;
            box-shadow: 0 3px 8px rgba(255, 120, 120, 0.45);
            border: 2.5px solid #ffffff;
            z-index: 6;
        }

        /* 결과 카드 하단 명대사 미니 툴팁 */
        .result-quote-sub {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-sub);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* 하단 고정 액션 버튼 */
        .footer-action {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 16px 20px 26px 20px;
            background: linear-gradient(to top, rgba(201, 227, 180, 0.98) 65%, rgba(201, 227, 180, 0));
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .action-btn {
            width: 100%;
            background: var(--primary);
            color: #1e293b;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(130, 220, 40, 0.4);
            transition: all 0.2s ease;
        }

        .action-btn:active {
            transform: scale(0.98);
            background: var(--primary-hover);
        }

        /* 바텀시트 모달 */
        .bottom-sheet-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(3px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .bottom-sheet-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            width: 100%;
            background: #ffffff;
            border-top-left-radius: 26px;
            border-top-right-radius: 26px;
            padding: 22px 24px 34px 24px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.12);
        }

        .bottom-sheet-overlay.active .bottom-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 42px;
            height: 5px;
            background: #cbd5e1;
            border-radius: 3px;
            margin: 0 auto 18px auto;
        }

        .sheet-msg {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 22px;
        }

        .sheet-confirm-btn {
            width: 100%;
            background: var(--primary);
            color: #1e293b;
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- 배경 산 & 수풀 SVG 디테일 -->
        <svg class="scenery-layer" viewBox="0 0 480 120" preserveAspectRatio="none">
            <path d="M0,90 L85,35 L190,85 L330,28 L460,85 L480,75 L480,120 L0,120 Z" fill="#b7b1cb" stroke="#6d5959" stroke-width="3"/>
            <path d="M0,95 Q20,65 45,88 Q70,55 100,88 Q135,60 165,90 Q205,45 245,88 Q280,65 315,90 Q355,55 395,88 Q435,60 480,85 L480,120 L0,120 Z" fill="#88b872" stroke="#5c4938" stroke-width="3"/>
            <rect x="0" y="96" width="480" height="8" fill="#eef7df"/>
        </svg>

        <!-- 상단 헤더 -->
        <header>
            <a href="index.html" class="nav-btn" id="homeBtn">🏠 홈</a>
            <button class="nav-btn" id="backBtn" onclick="goBack()" style="display: none;">← 다시 뽑기</button>
            <div class="header-title" id="headerTitle">호빵맨 선택하기</div>
            <button class="sound-btn" id="soundToggleBtn" onclick="toggleSound()" title="음성/효과음 켜기·끄기">🔊</button>
        </header>

        <!-- 캐릭터 명대사 플로팅 토스트 -->
        <div class="quote-toast" id="quoteToast">
            <span class="quote-speaker" id="quoteSpeaker">호빵맨</span>
            <span class="quote-text" id="quoteText">"힘내라! 내 얼굴을 먹어!"</span>
        </div>

        <!-- [페이지 1] 캐릭터 선택 화면 -->
        <div class="page" id="selectPage">
            <div class="content-scroll">
                <div class="character-grid" id="anpanmanGrid"></div>
            </div>
            <div class="footer-action">
                <button class="action-btn" onclick="openBottomSheet()">선택하기</button>
            </div>
        </div>

        <!-- [페이지 2] 랜덤 순서 결과 화면 -->
        <div class="page hidden" id="resultPage">
            <div class="content-scroll">
                <div class="character-grid" id="resultGrid"></div>
            </div>
            <div class="footer-action">
                <button class="action-btn" onclick="goBack()">다시 선택하기</button>
            </div>
        </div>

        <!-- 바텀시트 모달 -->
        <div class="bottom-sheet-overlay" id="bottomSheetOverlay" onclick="closeBottomSheet(event)">
            <div class="bottom-sheet" onclick="event.stopPropagation()">
                <div class="sheet-handle"></div>
                <div class="sheet-msg" id="sheetMsg">0명의 캐릭터 선택하였습니다.</div>
                <button class="sheet-confirm-btn" onclick="confirmSelection()">순서 결과 보기</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * poster.jpeg (4열 x 3행) 좌표 매핑 및 캐릭터별 명대사·음성 피치 설정
         * col: 0~3 (왼쪽->오른쪽), row: 0~2 (위->아래)
         */
        const anpanmanCharacters = [
            { id: 1,  name: '호빵맨',    col: 0, row: 0, quote: '힘내라! 내 얼굴을 먹어! 호빵 펀치!', pitch: 1.15, rate: 1.05 },
            { id: 2,  name: '식빵맨',    col: 1, row: 0, quote: '오늘도 산뜻하고 부드러운 식빵을 배달합니다!', pitch: 0.95, rate: 1.0 },
            { id: 3,  name: '카레빵맨',  col: 2, row: 0, quote: '뜨겁고 매콤한 카레 맛 좀 볼래?!', pitch: 1.1, rate: 1.12 },
            { id: 4,  name: '잼아저씨',  col: 3, row: 0, quote: '허허허, 맛있는 새 얼굴이 다 구워졌단다!', pitch: 0.72, rate: 0.92 },
            { id: 5,  name: '버터누나',  col: 0, row: 1, quote: '자, 호빵맨! 새 얼굴을 던질게, 받아!', pitch: 1.35, rate: 1.05 },
            { id: 6,  name: '명견 치즈', col: 1, row: 1, quote: '멍멍! 냄새로 다 찾을 수 있어요, 멍!', pitch: 1.45, rate: 1.15 },
            { id: 7,  name: '메론빵나',  col: 2, row: 1, quote: '메론 쥬스~ 멜로멜로 펀치! 헤롱헤롱~', pitch: 1.5, rate: 1.05 },
            { id: 8,  name: '롤빵나',    col: 3, row: 1, quote: '메론빵나는 내가 지킨다... 로울 리본!', pitch: 0.9, rate: 0.95 },
            { id: 9,  name: '크림판다',  col: 0, row: 2, quote: '나도 언젠가 호빵맨처럼 멋지게 날 거야! 주먹가위보 펀치!', pitch: 1.4, rate: 1.1 },
            { id: 10, name: '세균맨',    col: 1, row: 2, quote: '하히후헤호~! 꼼짝 마라, 호빵맨!', pitch: 0.78, rate: 1.12 },
            { id: 11, name: '짤랑이',    col: 2, row: 2, quote: '식빵맨님~ 너무 멋져요! 세균맨, 내 말 들어!', pitch: 1.48, rate: 1.08 },
            { id: 12, name: '딸랑이',    col: 3, row: 2, quote: '내 파란 눈물에 닿으면 전부 우는 수밖에 없을걸~!', pitch: 1.58, rate: 1.12 }
        ];

        // poster.jpeg 4열 x 3행에서 하단 글자를 제외하고 캐릭터 얼굴/상반신 중앙을 정확히 잡는 좌표(%)
        const colPos = ['3.2%', '34.4%', '65.6%', '96.8%'];
        const rowPos = ['2.5%', '46.5%', '90.5%'];

        let selectedIds = [];
        let soundEnabled = true;
        let quoteTimer = null;
        let audioCtx = null;

        // Web Audio API 초기화 및 효과음
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playChime(type = 'select') {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'select') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.12); // G5
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                osc.start(now);
                osc.stop(now + 0.18);
            } else if (type === 'fanfare') {
                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + idx * 0.08);
                    g.gain.setValueAtTime(0.16, now + idx * 0.08);
                    g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.22);
                    o.start(now + idx * 0.08);
                    o.stop(now + idx * 0.08 + 0.22);
                });
            }
        }

        // 캐릭터 명대사 음성(Web Speech API) 및 상단 말풍선 표시
        function triggerCharacterQuote(char) {
            const toast = document.getElementById('quoteToast');
            const speaker = document.getElementById('quoteSpeaker');
            const text = document.getElementById('quoteText');

            speaker.innerText = char.name;
            text.innerText = `"${char.quote}"`;
            toast.classList.add('show');

            if (quoteTimer) clearTimeout(quoteTimer);
            quoteTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2600);

            if (soundEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(char.quote);
                utter.lang = 'ko-KR';
                utter.pitch = char.pitch || 1.0;
                utter.rate = char.rate || 1.0;
                window.speechSynthesis.speak(utter);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggleBtn');
            btn.innerText = soundEnabled ? '🔊' : '🔇';
            if (!soundEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        // 선택 그리드 렌더링 (poster.jpeg 크롭 방식)
        function renderGrid() {
            const grid = document.getElementById('anpanmanGrid');
            grid.innerHTML = '';

            anpanmanCharacters.forEach(char => {
                const isSelected = selectedIds.includes(char.id);
                const card = document.createElement('div');
                card.className = `char-card ${isSelected ? 'selected' : ''}`;
                card.onclick = () => toggleSelect(char);

                const bgX = colPos[char.col];
                const bgY = rowPos[char.row];

                card.innerHTML = `
                    <div class="select-check">✓</div>
                    <div class="poster-sprite" style="background-position: ${bgX} ${bgY};"></div>
                    <div class="char-name">${char.name}</div>
                `;
                grid.appendChild(card);
            });
        }

        // 캐릭터 선택/해제 토글 + 명대사 발동
        function toggleSelect(char) {
            if (selectedIds.includes(char.id)) {
                selectedIds = selectedIds.filter(item => item !== char.id);
            } else {
                selectedIds.push(char.id);
                playChime('select');
                triggerCharacterQuote(char);
            }
            renderGrid();
        }

        // 피셔-예이츠 랜덤 셔플
        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // 바텀시트 열기
        function openBottomSheet() {
            if (selectedIds.length === 0) {
                alert('최소 1명 이상의 캐릭터를 선택해주세요!');
                return;
            }
            document.getElementById('sheetMsg').innerText = `${selectedIds.length}명의 캐릭터 선택하였습니다.`;
            document.getElementById('bottomSheetOverlay').classList.add('active');
        }

        // 바텀시트 닫기
        function closeBottomSheet(e) {
            if (e && e.target.id === 'bottomSheetOverlay') {
                document.getElementById('bottomSheetOverlay').classList.remove('active');
            }
        }

        // 확인 클릭 -> 페이드아웃 후 결과 페이지 페이드인
        function confirmSelection() {
            document.getElementById('bottomSheetOverlay').classList.remove('active');
            playChime('fanfare');

            const selectPage = document.getElementById('selectPage');
            const resultPage = document.getElementById('resultPage');
            const homeBtn = document.getElementById('homeBtn');
            const backBtn = document.getElementById('backBtn');
            const headerTitle = document.getElementById('headerTitle');

            selectPage.classList.add('hidden');
            homeBtn.style.display = 'none';
            backBtn.style.display = 'flex';
            headerTitle.innerText = '휴게시간 순서 결과';

            renderResultGrid();

            setTimeout(() => {
                resultPage.classList.remove('hidden');
            }, 60);
        }

        // 결과 화면 렌더링 (poster.jpeg 크롭 + 우측 상단 겹침 알파벳 배지 + 터치 시 명대사 다시 듣기)
        function renderResultGrid() {
            const resultGrid = document.getElementById('resultGrid');
            resultGrid.innerHTML = '';

            const alphabets = selectedIds.map((_, idx) => String.fromCharCode(65 + idx));
            const shuffledAlphabets = shuffleArray(alphabets);

            selectedIds.forEach((id, index) => {
                const char = anpanmanCharacters.find(c => c.id === id);
                const badgeLetter = shuffledAlphabets[index];
                const bgX = colPos[char.col];
                const bgY = rowPos[char.row];

                const card = document.createElement('div');
                card.className = 'char-card selected';
                card.onclick = () => triggerCharacterQuote(char);
                card.innerHTML = `
                    <div class="result-badge">${badgeLetter}</div>
                    <div class="poster-sprite" style="background-position: ${bgX} ${bgY};"></div>
                    <div class="char-name">${char.name}</div>
                `;
                resultGrid.appendChild(card);
            });
        }

        // 다시 선택하기 (뒤로가기)
        function goBack() {
            const selectPage = document.getElementById('selectPage');
            const resultPage = document.getElementById('resultPage');
            const homeBtn = document.getElementById('homeBtn');
            const backBtn = document.getElementById('backBtn');
            const headerTitle = document.getElementById('headerTitle');

            resultPage.classList.add('hidden');
            homeBtn.style.display = 'flex';
            backBtn.style.display = 'none';
            headerTitle.innerText = '호빵맨 선택하기';

            setTimeout(() => {
                selectPage.classList.remove('hidden');
            }, 200);
        }

        window.onload = () => {
            renderGrid();
        };
    </script>
</body>
</html>
