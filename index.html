<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>휴게시간 순서뽑기</title>
<link rel="apple-touch-icon" href="icon-180.png">  
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<!-- Pretendard 폰트 & Confetti 라이브러리 -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
:root {
    --highlight: #82DC28;
    --highlight-dark: #65b01c;
    --bg-color: #f1f4f9;
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --clay-border: rgba(255, 255, 255, 0.85);
    
    /* Claymorphism Shadows */
    --clay-card-shadow: 
        12px 16px 28px rgba(163, 177, 198, 0.35),
        -10px -10px 24px rgba(255, 255, 255, 0.9),
        inset 2px 2px 4px rgba(255, 255, 255, 0.8),
        inset -3px -3px 6px rgba(163, 177, 198, 0.2);

    --clay-btn-shadow:
        6px 8px 16px rgba(163, 177, 198, 0.35),
        -6px -6px 14px rgba(255, 255, 255, 0.95),
        inset 2px 2px 3px rgba(255, 255, 255, 0.8),
        inset -2px -2px 4px rgba(0, 0, 0, 0.08);

    --clay-highlight-shadow:
        0 10px 22px rgba(130, 220, 40, 0.45),
        inset 0 3px 6px rgba(255, 255, 255, 0.6),
        inset 0 -4px 8px rgba(0, 0, 0, 0.15);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 24px 16px 48px;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    min-height: 100vh;
}

.app-container {
    width: 100%;
    max-width: 440px;
    position: relative;
}

/* 페이지 전환 뷰 */
.view {
    display: none;
    flex-direction: column;
    width: 100%;
    animation: fadeIn 0.35s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
}

.view.active {
    display: flex;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.header {
    text-align: center;
    margin-bottom: 22px;
}

.title-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 20px;
    background: #e2f7c6;
    color: var(--highlight-dark);
    margin-bottom: 8px;
    letter-spacing: -0.2px;
}

h1 {
    font-size: 26px;
    font-weight: 900;
    margin: 0;
    letter-spacing: -0.6px;
    color: var(--text-main);
}

.clay-card {
    background: var(--card-bg);
    border-radius: 28px;
    padding: 20px 22px;
    box-shadow: var(--clay-card-shadow);
    border: 2px solid var(--clay-border);
    margin-bottom: 20px;
}

.people-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.people-info {
    display: flex;
    align-items: center;
    gap: 8px;
}

.label-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--text-main);
}

.btn-mini-reset {
    background: #edf2f7;
    border: none;
    color: var(--text-muted);
    padding: 6px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 2px 2px 6px rgba(163, 177, 198, 0.3), inset 1px 1px 2px #fff;
    transition: all 0.15s ease;
}

.btn-mini-reset:active {
    transform: scale(0.92);
}

.stepper {
    display: flex;
    align-items: center;
    gap: 12px;
}

.btn-circle {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: #ffffff;
    font-size: 20px;
    font-weight: 800;
    color: var(--text-main);
    cursor: pointer;
    box-shadow: var(--clay-btn-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
}

.btn-circle:active {
    transform: scale(0.9);
    box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.12);
}

.count-display {
    font-size: 22px;
    font-weight: 900;
    min-width: 44px;
    text-align: center;
    color: var(--text-main);
}

.guide-banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding: 0 6px;
}

.guide-banner span {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-muted);
}

.guide-pill {
    font-size: 12px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 12px;
    background: #e2e8f0;
    color: #475569;
}

.guide-pill.completed {
    background: var(--highlight);
    color: #1e3a03;
}

.color-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 26px;
}

.clay-color-chip {
    height: 68px;
    border-radius: 20px;
    border: 3px solid rgba(255, 255, 255, 0.65);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
    box-shadow: 
        5px 6px 14px rgba(163, 177, 198, 0.4),
        inset 2px 2px 5px rgba(255, 255, 255, 0.65),
        inset -2px -3px 6px rgba(0, 0, 0, 0.2);
}

.clay-color-chip:active {
    transform: scale(0.93);
}

.clay-color-chip.selected {
    transform: scale(0.96);
    border-color: var(--highlight);
    box-shadow: 
        0 0 0 2px var(--highlight),
        inset 2px 3px 8px rgba(0, 0, 0, 0.35);
}

.clay-color-chip.selected::after {
    content: "✓";
    position: absolute;
    top: -5px;
    right: -5px;
    width: 22px;
    height: 22px;
    background: var(--highlight);
    color: #112800;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #ffffff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
}

.btn-primary-clay {
    width: 100%;
    height: 60px;
    background: var(--highlight);
    border: none;
    border-radius: 24px;
    font-size: 18px;
    font-weight: 900;
    color: #1a3303;
    letter-spacing: -0.4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: var(--clay-highlight-shadow);
    transition: all 0.15s ease;
}

.btn-primary-clay:active {
    transform: scale(0.97);
    box-shadow: 0 4px 10px rgba(130, 220, 40, 0.4), inset 0 2px 5px rgba(0,0,0,0.2);
}

/* 주사위 굴릴 때 흔들리는 효과 */
@keyframes shake {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-10deg) scale(1.05); }
    75% { transform: rotate(10deg) scale(1.05); }
}

.rolling-icon {
    display: inline-block;
    animation: shake 0.15s infinite;
}

.result-header {
    text-align: center;
    margin-bottom: 22px;
}

.result-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
}

.result-card-item {
    background: #ffffff;
    border-radius: 20px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 
        6px 8px 18px rgba(163, 177, 198, 0.25),
        -4px -4px 12px rgba(255, 255, 255, 0.9),
        inset 1px 1px 3px rgba(255, 255, 255, 0.8);
    border: 1.5px solid rgba(255, 255, 255, 0.85);
    animation: itemPop 0.4s cubic-bezier(0.2, 0.9, 0.3, 1) both;
}

@keyframes itemPop {
    from {
        opacity: 0;
        transform: translateY(16px) scale(0.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.color-dot-clay {
    min-width: 62px;
    height: 36px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 
        inset 1px 2px 4px rgba(255, 255, 255, 0.5),
        inset -1px -2px 4px rgba(0,0,0,0.15),
        0 3px 6px rgba(0,0,0,0.06);
}

.user-tag {
    font-size: 18px;
    font-weight: 900;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 6px;
}

.user-tag span {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
}

.order-badge-clay {
    margin-left: auto;
    font-size: 13px;
    font-weight: 800;
    padding: 7px 12px;
    border-radius: 14px;
    background: #edf9db;
    color: var(--highlight-dark);
    box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.8);
    white-space: nowrap;
}

.action-row {
    display: flex;
    gap: 12px;
}

.btn-secondary-clay {
    flex: 1;
    height: 56px;
    background: #ffffff;
    border: none;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 800;
    color: var(--text-main);
    cursor: pointer;
    box-shadow: var(--clay-btn-shadow);
    transition: all 0.15s ease;
}

.btn-secondary-clay:active {
    transform: scale(0.97);
}

.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(70px);
    background: #1e293b;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 20px;
    border-radius: 20px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.2);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 1000;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="app-container">

    <!-- [PAGE 1] 설정 및 컬러 선택 뷰 -->
    <div id="selectionView" class="view active">
        <header class="header">
            <span class="title-badge">RANDOM PICKER</span>
            <h1>🎲 휴게 순서 컬러 뽑기</h1>
        </header>

        <section class="clay-card people-section">
            <div class="people-info">
                <span class="label-title">참여 인원</span>
                <button class="btn-mini-reset" onclick="resetAll()">🔄 초기화</button>
            </div>
            <div class="stepper">
                <button class="btn-circle" onclick="changePeople(-1)">－</button>
                <span class="count-display" id="peopleCount">4명</span>
                <button class="btn-circle" onclick="changePeople(1)">＋</button>
            </div>
        </section>

        <div class="guide-banner">
            <span id="guideText">컬러를 인원수(4개)만큼 선택하세요</span>
            <span class="guide-pill" id="guidePill">0 / 4</span>
        </div>

        <div class="color-grid" id="grid"></div>

        <button class="btn-primary-clay" id="drawBtn" onclick="startDrawProcess()">
            <span id="drawIcon">✨</span> <span id="drawBtnText">휴게 순서 뽑기</span>
        </button>
    </div>

    <!-- [PAGE 2] 전용 결과 랜딩 뷰 -->
    <div id="resultView" class="view">
        <header class="result-header">
            <span class="title-badge">RESULT</span>
            <h1>🎉 휴게 매칭 결과</h1>
            <p style="margin: 6px 0 0; color: var(--text-muted); font-size: 14px;">선택된 순번에 맞춰 휴식을 진행해주세요!</p>
        </header>

        <div class="result-list" id="result-content"></div>

        <div class="action-row">
            <button class="btn-secondary-clay" onclick="goBackToSelection()">
                ← 컬러 다시 고르기
            </button>
            <button class="btn-primary-clay" style="flex: 1.2; height: 56px;" onclick="reRoll()">
                🎲 다시 뽑기
            </button>
        </div>
    </div>

</div>

<div id="toast" class="toast"></div>

<script>
let people = 4;
const alphabet = 'ABCDEFGHIJKL'.split('');
const colors = [
    { n: '빨강', c: '#ff5c5c', text: '#fff' },
    { n: '노랑', c: '#ffd600', text: '#333' },
    { n: '파랑', c: '#3b82f6', text: '#fff' },
    { n: '초록', c: '#10b981', text: '#fff' },
    { n: '보라', c: '#a855f7', text: '#fff' },
    { n: '주황', c: '#f97316', text: '#fff' },
    { n: '핑크', c: '#ec4899', text: '#fff' },
    { n: '하늘', c: '#38bdf8', text: '#222' },
    { n: '갈색', c: '#8d6e63', text: '#fff' },
    { n: '회색', c: '#94a3b8', text: '#fff' },
    { n: '검정', c: '#334155', text: '#fff' },
    { n: '민트', c: '#2dd4bf', text: '#111' }
];

const orderTexts = [
    "첫번째 휴게시작", "두번째 휴게시작", "세번째 휴게시작", "네번째 휴게시작",
    "다섯번째 휴게시작", "여섯번째 휴게시작", "일곱번째 휴게시작", "여덟번째 휴게시작",
    "아홉번째 휴게시작", "열번째 휴게시작", "열한번째 휴게시작", "열두번째 휴게시작"
];

let selected = [];
let audioCtx = null;

// 공용 AudioContext 초기화 (모바일 자동재생 정책 대응)
function getAudioContext() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

// 🔔 1. 컬러 선택 '띠링~' 효과음
function playChimeSound(isSelect = true) {
    try {
        const ctx = getAudioContext();
        const baseFreq = isSelect ? 880 : 587; // A5 또는 D5
        const secondFreq = isSelect ? 1318.5 : 440; // E6 또는 A4

        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();

        osc1.type = 'sine';
        osc2.type = 'triangle';

        osc1.frequency.setValueAtTime(baseFreq, ctx.currentTime);
        osc1.frequency.exponentialRampToValueAtTime(secondFreq, ctx.currentTime + 0.12);

        osc2.frequency.setValueAtTime(baseFreq * 1.5, ctx.currentTime);

        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);

        osc1.start(ctx.currentTime);
        osc2.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 0.3);
        osc2.stop(ctx.currentTime + 0.3);
    } catch(e) {}
}

// 🎲 2. 주사위 굴러가는 "또르르르~" 사운드
function playDiceRollSound() {
    try {
        const ctx = getAudioContext();
        const totalClicks = 10;
        const duration = 0.65;

        for (let i = 0; i < totalClicks; i++) {
            const timeOffset = Math.pow(i / totalClicks, 1.3) * duration;
            const clickTime = ctx.currentTime + timeOffset;

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            // 주사위 깍두기가 부딪히는 나무/플라스틱 톤 (랜덤 주파수)
            const freq = 450 + Math.random() * 350;
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, clickTime);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.4, clickTime + 0.04);

            gain.gain.setValueAtTime(0.35, clickTime);
            gain.gain.exponentialRampToValueAtTime(0.01, clickTime + 0.04);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(clickTime);
            osc.stop(clickTime + 0.04);
        }
    } catch(e) {}
}

// 🎉 3. 컨페티 팡! + 축하 멜로디 사운드
function playConfettiSound() {
    try {
        const ctx = getAudioContext();

        // 팡! 소리
        const popOsc = ctx.createOscillator();
        const popGain = ctx.createGain();
        popOsc.type = 'triangle';
        popOsc.frequency.setValueAtTime(140, ctx.currentTime);
        popOsc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.15);
        popGain.gain.setValueAtTime(0.7, ctx.currentTime);
        popGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        popOsc.connect(popGain);
        popGain.connect(ctx.destination);
        popOsc.start(ctx.currentTime);
        popOsc.stop(ctx.currentTime + 0.15);

        // 챠르르 올라가는 축하 실로폰음 (C5, E5, G5, C6)
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const startTime = ctx.currentTime + 0.06 + (idx * 0.08);

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);

            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.28, startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.45);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(startTime);
            osc.stop(startTime + 0.45);
        });
    } catch (e) {}
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => {
        toast.classList.remove('show');
    }, 2000);
}

function renderColors() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    colors.forEach((item, index) => {
        const isSelected = selected.includes(index) ? 'selected' : '';
        grid.innerHTML += `
            <button 
                class="clay-color-chip ${isSelected}" 
                id="c${index}" 
                style="background: ${item.c}; color: ${item.text};" 
                onclick="toggleColor(${index})">
                ${item.n}
            </button>
        `;
    });
    updateGuide();
}

function updateGuide() {
    const guideText = document.getElementById('guideText');
    const guidePill = document.getElementById('guidePill');
    guideText.innerText = `컬러를 인원수(${people}개)만큼 선택하세요`;
    guidePill.innerText = `${selected.length} / ${people}`;
    
    if (selected.length === people) {
        guidePill.classList.add('completed');
    } else {
        guidePill.classList.remove('completed');
    }
}

function toggleColor(index) {
    const idx = selected.indexOf(index);
    if (idx > -1) {
        // 선택 해제
        selected.splice(idx, 1);
        document.getElementById('c' + index).classList.remove('selected');
        playChimeSound(false);
    } else {
        // 새로 선택
        if (selected.length >= people) {
            showToast(`인원 수(${people}명)만큼만 선택할 수 있습니다.`);
            return;
        }
        selected.push(index);
        document.getElementById('c' + index).classList.add('selected');
        playChimeSound(true); // 🔔 '띠링~' 사운드
    }
    updateGuide();
}

function changePeople(num) {
    const nextVal = people + num;
    if (nextVal < 2) {
        showToast("최소 인원은 2명입니다.");
        return;
    }
    if (nextVal > 12) {
        showToast("최대 인원은 12명입니다.");
        return;
    }
    people = nextVal;
    resetAll();
}

function resetAll() {
    selected = [];
    document.getElementById('peopleCount').innerText = people + "명";
    renderColors();
}

function shuffle(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

function triggerConfetti() {
    playConfettiSound(); // 🎉 팡! 사운드

    if (typeof confetti === 'function') {
        const count = 200;
        const defaults = {
            origin: { y: 0.65 },
            colors: ['#82DC28', '#ffffff', '#ffd600', '#38bdf8', '#ff5c5c']
        };

        function fire(particleRatio, opts) {
            confetti(Object.assign({}, defaults, opts, {
                particleCount: Math.floor(count * particleRatio)
            }));
        }

        fire(0.25, { spread: 26, startVelocity: 55 });
        fire(0.2, { spread: 60 });
        fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
        fire(0.1, { spread: 120, startVelocity: 45 });
    }
}

// 🎲 주사위 굴리는 시뮬레이션 후 결과 페이지 랜딩
function startDrawProcess() {
    if (selected.length !== people) {
        showToast(`인원 수와 동일하게 ${people}개의 컬러를 선택해주세요.`);
        return;
    }

    const drawBtn = document.getElementById('drawBtn');
    const drawIcon = document.getElementById('drawIcon');
    const drawBtnText = document.getElementById('drawBtnText');

    // 버튼 애니메이션 & 사운드
    drawBtn.disabled = true;
    drawIcon.innerText = "🎲";
    drawIcon.classList.add('rolling-icon');
    drawBtnText.innerText = "순서 섞는 중...";

    // 🎲 "또르르르~" 주사위 굴러가는 소리 재생
    playDiceRollSound();

    // 0.65초 뒤 주사위가 멈추고 결과 페이지로 전환
    setTimeout(() => {
        renderResultRows();

        document.getElementById('selectionView').classList.remove('active');
        document.getElementById('resultView').classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });

        // 버튼 원래 상태로 복구
        drawBtn.disabled = false;
        drawIcon.innerText = "✨";
        drawIcon.classList.remove('rolling-icon');
        drawBtnText.innerText = "휴게 순서 뽑기";

        // 컨페티 & 축하 사운드 폭죽
        triggerConfetti();
    }, 650);
}

function renderResultRows() {
    const shuffled = shuffle(selected);
    let html = '';
    
    for (let i = 0; i < people; i++) {
        const colorItem = colors[shuffled[i]];
        const delay = (i * 0.05).toFixed(2);

        html += `
            <div class="result-card-item" style="animation-delay: ${delay}s">
                <div class="color-dot-clay" style="background: ${colorItem.c}; color: ${colorItem.text};">
                    ${colorItem.n}
                </div>
                <div class="user-tag">
                    ${alphabet[i]} <span>조원</span>
                </div>
                <div class="order-badge-clay">
                    ${orderTexts[i]}
                </div>
            </div>
        `;
    }
    document.getElementById('result-content').innerHTML = html;
}

// 결과 페이지 내 '다시 뽑기' 버튼
function reRoll() {
    playDiceRollSound();
    setTimeout(() => {
        renderResultRows();
        triggerConfetti();
    }, 400);
}

function goBackToSelection() {
    document.getElementById('resultView').classList.remove('active');
    document.getElementById('selectionView').classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderColors();
</script>
