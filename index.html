<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🎲 프리미엄 컬러 뽑기</title>
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<!-- Pretendard 폰트 & Confetti 라이브러리 -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
:root {
    --highlight: #82DC28;
    --highlight-dark: #65b01c;
    --bg-color: #f1f4f9;
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --clay-border: rgba(255, 255, 255, 0.85);
    
    /* Claymorphism Shadows */
    --clay-card-shadow: 
        12px 16px 28px rgba(163, 177, 198, 0.35),
        -10px -10px 24px rgba(255, 255, 255, 0.9),
        inset 2px 2px 4px rgba(255, 255, 255, 0.8),
        inset -3px -3px 6px rgba(163, 177, 198, 0.2);

    --clay-btn-shadow:
        6px 8px 16px rgba(163, 177, 198, 0.35),
        -6px -6px 14px rgba(255, 255, 255, 0.95),
        inset 2px 2px 3px rgba(255, 255, 255, 0.8),
        inset -2px -2px 4px rgba(0, 0, 0, 0.08);

    --clay-highlight-shadow:
        0 10px 22px rgba(130, 220, 40, 0.45),
        inset 0 3px 6px rgba(255, 255, 255, 0.6),
        inset 0 -4px 8px rgba(0, 0, 0, 0.15);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 24px 16px 48px;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    min-height: 100vh;
}

.app-container {
    width: 100%;
    max-width: 440px;
    position: relative;
}

/* 페이지 전환 뷰 컨테이너 */
.view {
    display: none;
    flex-direction: column;
    width: 100%;
    animation: fadeIn 0.35s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
}

.view.active {
    display: flex;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* 상단 타이틀 헤더 */
.header {
    text-align: center;
    margin-bottom: 22px;
}

.title-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 800;
    padding: 5px 12px;
    border-radius: 20px;
    background: #e2f7c6;
    color: var(--highlight-dark);
    margin-bottom: 8px;
    letter-spacing: -0.2px;
}

h1 {
    font-size: 26px;
    font-weight: 900;
    margin: 0;
    letter-spacing: -0.6px;
    color: var(--text-main);
}

/* 클레이 카드 */
.clay-card {
    background: var(--card-bg);
    border-radius: 28px;
    padding: 20px 22px;
    box-shadow: var(--clay-card-shadow);
    border: 2px solid var(--clay-border);
    margin-bottom: 20px;
}

/* 인원 설정 영역 */
.people-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.people-info {
    display: flex;
    align-items: center;
    gap: 8px;
}

.label-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--text-main);
}

.btn-mini-reset {
    background: #edf2f7;
    border: none;
    color: var(--text-muted);
    padding: 6px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 2px 2px 6px rgba(163, 177, 198, 0.3), inset 1px 1px 2px #fff;
    transition: all 0.15s ease;
}

.btn-mini-reset:active {
    transform: scale(0.92);
}

.stepper {
    display: flex;
    align-items: center;
    gap: 12px;
}

.btn-circle {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: #ffffff;
    font-size: 20px;
    font-weight: 800;
    color: var(--text-main);
    cursor: pointer;
    box-shadow: var(--clay-btn-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
}

.btn-circle:active {
    transform: scale(0.9);
    box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.12);
}

.count-display {
    font-size: 22px;
    font-weight: 900;
    min-width: 44px;
    text-align: center;
    color: var(--text-main);
}

/* 상태 인디케이터 배너 */
.guide-banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding: 0 6px;
}

.guide-banner span {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-muted);
}

.guide-pill {
    font-size: 12px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 12px;
    background: #e2e8f0;
    color: #475569;
}

.guide-pill.completed {
    background: var(--highlight);
    color: #1e3a03;
}

/* 컬러 선택 그리드 */
.color-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 26px;
}

.clay-color-chip {
    height: 68px;
    border-radius: 20px;
    border: 3px solid rgba(255, 255, 255, 0.65);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
    box-shadow: 
        5px 6px 14px rgba(163, 177, 198, 0.4),
        inset 2px 2px 5px rgba(255, 255, 255, 0.65),
        inset -2px -3px 6px rgba(0, 0, 0, 0.2);
}

.clay-color-chip:active {
    transform: scale(0.93);
}

/* 선택된 컬러 칩 하이라이트 */
.clay-color-chip.selected {
    transform: scale(0.96);
    border-color: var(--highlight);
    box-shadow: 
        0 0 0 2px var(--highlight),
        inset 2px 3px 8px rgba(0, 0, 0, 0.35);
}

.clay-color-chip.selected::after {
    content: "✓";
    position: absolute;
    top: -5px;
    right: -5px;
    width: 22px;
    height: 22px;
    background: var(--highlight);
    color: #112800;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #ffffff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
}

/* 메인 하이라이트 액션 버튼 */
.btn-primary-clay {
    width: 100%;
    height: 60px;
    background: var(--highlight);
    border: none;
    border-radius: 24px;
    font-size: 18px;
    font-weight: 900;
    color: #1a3303;
    letter-spacing: -0.4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: var(--clay-highlight-shadow);
    transition: all 0.15s ease;
}

.btn-primary-clay:active {
    transform: scale(0.97);
    box-shadow: 0 4px 10px rgba(130, 220, 40, 0.4), inset 0 2px 5px rgba(0,0,0,0.2);
}

/* 결과 페이지 스타일 */
.result-header {
    text-align: center;
    margin-bottom: 22px;
}

.result-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
}

.result-card-item {
    background: #ffffff;
    border-radius: 20px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 
        6px 8px 18px rgba(163, 177, 198, 0.25),
        -4px -4px 12px rgba(255, 255, 255, 0.9),
        inset 1px 1px 3px rgba(255, 255, 255, 0.8);
    border: 1.5px solid rgba(255, 255, 255, 0.85);
    animation: itemPop 0.4s cubic-bezier(0.2, 0.9, 0.3, 1) both;
}

@keyframes itemPop {
    from {
        opacity: 0;
        transform: translateY(16px) scale(0.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.color-dot-clay {
    min-width: 62px;
    height: 36px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 
        inset 1px 2px 4px rgba(255, 255, 255, 0.5),
        inset -1px -2px 4px rgba(0,0,0,0.15),
        0 3px 6px rgba(0,0,0,0.06);
}

.user-tag {
    font-size: 18px;
    font-weight: 900;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 6px;
}

.user-tag span {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
}

.order-badge-clay {
    margin-left: auto;
    font-size: 13px;
    font-weight: 800;
    padding: 7px 12px;
    border-radius: 14px;
    background: #edf9db;
    color: var(--highlight-dark);
    box-shadow: inset 1px 1px 2px rgba(255, 255, 255, 0.8);
    white-space: nowrap;
}

.action-row {
    display: flex;
    gap: 12px;
}

.btn-secondary-clay {
    flex: 1;
    height: 56px;
    background: #ffffff;
    border: none;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 800;
    color: var(--text-main);
    cursor: pointer;
    box-shadow: var(--clay-btn-shadow);
    transition: all 0.15s ease;
}

.btn-secondary-clay:active {
    transform: scale(0.97);
}

/* 알림 토스트 */
.toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(70px);
    background: #1e293b;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 20px;
    border-radius: 20px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.2);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 1000;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="app-container">

    <!-- [PAGE 1] 설정 및 컬러 선택 뷰 -->
    <div id="selectionView" class="view active">
        <header class="header">
            <span class="title-badge">RANDOM PICKER</span>
            <h1>🎲 휴게 순서 컬러 뽑기</h1>
        </header>

        <section class="clay-card people-section">
            <div class="people-info">
                <span class="label-title">참여 인원</span>
                <button class="btn-mini-reset" onclick="resetAll()">🔄 초기화</button>
            </div>
            <div class="stepper">
                <button class="btn-circle" onclick="changePeople(-1)">－</button>
                <span class="count-display" id="peopleCount">4명</span>
                <button class="btn-circle" onclick="changePeople(1)">＋</button>
            </div>
        </section>

        <div class="guide-banner">
            <span id="guideText">컬러를 인원수(4개)만큼 선택하세요</span>
            <span class="guide-pill" id="guidePill">0 / 4</span>
        </div>

        <!-- 컬러 그리드 -->
        <div class="color-grid" id="grid"></div>

        <button class="btn-primary-clay" onclick="drawResult()">
            <span>✨</span> 휴게 순서 뽑기
        </button>
    </div>

    <!-- [PAGE 2] 전용 결과 랜딩 뷰 -->
    <div id="resultView" class="view">
        <header class="result-header">
            <span class="title-badge">RESULT</span>
            <h1>🎉 휴게 매칭 결과</h1>
            <p style="margin: 6px 0 0; color: var(--text-muted); font-size: 14px;">선택된 순번에 맞춰 휴식을 진행해주세요!</p>
        </header>

        <div class="result-list" id="result-content"></div>

        <div class="action-row">
            <button class="btn-secondary-clay" onclick="goBackToSelection()">
                ← 컬러 다시 고르기
            </button>
            <button class="btn-primary-clay" style="flex: 1.2; height: 56px;" onclick="reRoll()">
                🎲 다시 뽑기
            </button>
        </div>
    </div>

</div>

<!-- 미니 토스트 메시지 -->
<div id="toast" class="toast"></div>

<script>
let people = 4;
const alphabet = 'ABCDEFGHIJKL'.split('');
const colors = [
    { n: '빨강', c: '#ff5c5c', text: '#fff' },
    { n: '노랑', c: '#ffd600', text: '#333' },
    { n: '파랑', c: '#3b82f6', text: '#fff' },
    { n: '초록', c: '#10b981', text: '#fff' },
    { n: '보라', c: '#a855f7', text: '#fff' },
    { n: '주황', c: '#f97316', text: '#fff' },
    { n: '핑크', c: '#ec4899', text: '#fff' },
    { n: '하늘', c: '#38bdf8', text: '#222' },
    { n: '갈색', c: '#8d6e63', text: '#fff' },
    { n: '회색', c: '#94a3b8', text: '#fff' },
    { n: '검정', c: '#334155', text: '#fff' },
    { n: '민트', c: '#2dd4bf', text: '#111' }
];

const orderTexts = [
    "첫번째 휴게시작", "두번째 휴게시작", "세번째 휴게시작", "네번째 휴게시작",
    "다섯번째 휴게시작", "여섯번째 휴게시작", "일곱번째 휴게시작", "여덟번째 휴게시작",
    "아홉번째 휴게시작", "열번째 휴게시작", "열한번째 휴게시작", "열두번째 휴게시작"
];

let selected = [];

// 토스트 메시지 함수
function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => {
        toast.classList.remove('show');
    }, 2000);
}

// 컬러 렌더링
function renderColors() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    colors.forEach((item, index) => {
        const isSelected = selected.includes(index) ? 'selected' : '';
        grid.innerHTML += `
            <button 
                class="clay-color-chip ${isSelected}" 
                id="c${index}" 
                style="background: ${item.c}; color: ${item.text};" 
                onclick="toggleColor(${index})">
                ${item.n}
            </button>
        `;
    });
    updateGuide();
}

function updateGuide() {
    const guideText = document.getElementById('guideText');
    const guidePill = document.getElementById('guidePill');
    guideText.innerText = `컬러를 인원수(${people}개)만큼 선택하세요`;
    guidePill.innerText = `${selected.length} / ${people}`;
    
    if (selected.length === people) {
        guidePill.classList.add('completed');
    } else {
        guidePill.classList.remove('completed');
    }
}

function toggleColor(index) {
    const idx = selected.indexOf(index);
    if (idx > -1) {
        selected.splice(idx, 1);
        document.getElementById('c' + index).classList.remove('selected');
    } else {
        if (selected.length >= people) {
            showToast(`인원 수(${people}명)만큼만 선택할 수 있습니다.`);
            return;
        }
        selected.push(index);
        document.getElementById('c' + index).classList.add('selected');
    }
    updateGuide();
}

function changePeople(num) {
    const nextVal = people + num;
    if (nextVal < 2) {
        showToast("최소 인원은 2명입니다.");
        return;
    }
    if (nextVal > 12) {
        showToast("최대 인원은 12명입니다.");
        return;
    }
    people = nextVal;
    resetAll();
}

function resetAll() {
    selected = [];
    document.getElementById('peopleCount').innerText = people + "명";
    renderColors();
}

// 셔플 알고리즘
function shuffle(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

// 하이라이트(#82DC28) 포함 컨페티 폭죽 효과
function triggerConfetti() {
    if (typeof confetti === 'function') {
        const count = 200;
        const defaults = {
            origin: { y: 0.65 },
            colors: ['#82DC28', '#ffffff', '#ffd600', '#38bdf8', '#ff5c5c']
        };

        function fire(particleRatio, opts) {
            confetti(Object.assign({}, defaults, opts, {
                particleCount: Math.floor(count * particleRatio)
            }));
        }

        fire(0.25, { spread: 26, startVelocity: 55 });
        fire(0.2, { spread: 60 });
        fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
        fire(0.1, { spread: 120, startVelocity: 45 });
    }
}

// 추첨 실행 및 결과 페이지 랜딩
function drawResult() {
    if (selected.length !== people) {
        showToast(`인원 수와 동일하게 ${people}개의 컬러를 선택해주세요.`);
        return;
    }
    
    renderResultRows();

    // 페이지 전환 (선택화면 Hide -> 결과화면 Show)
    document.getElementById('selectionView').classList.remove('active');
    document.getElementById('resultView').classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });

    // 축하 컨페티 실행
    triggerConfetti();
}

function renderResultRows() {
    const shuffled = shuffle(selected);
    let html = '';
    
    for (let i = 0; i < people; i++) {
        const colorItem = colors[shuffled[i]];
        const delay = (i * 0.05).toFixed(2);

        html += `
            <div class="result-card-item" style="animation-delay: ${delay}s">
                <div class="color-dot-clay" style="background: ${colorItem.c}; color: ${colorItem.text};">
                    ${colorItem.n}
                </div>
                <div class="user-tag">
                    ${alphabet[i]} <span>조원</span>
                </div>
                <div class="order-badge-clay">
                    ${orderTexts[i]}
                </div>
            </div>
        `;
    }
    document.getElementById('result-content').innerHTML = html;
}

// 동일 조합으로 다시 뽑기
function reRoll() {
    renderResultRows();
    triggerConfetti();
}

// 다시 컬러 선택 화면으로 복귀
function goBackToSelection() {
    document.getElementById('resultView').classList.remove('active');
    document.getElementById('selectionView').classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 초기화 실행
renderColors();
</script>

</body>
</html>
