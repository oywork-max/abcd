<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#3E2723">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>휴게시간 순서뽑기 - 컬러</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
    <style>
        :root {
            --header-wood: #3E2723;
            --desk-wood-base: #8D5B3C;
            --primary-lime: #82DC28;
            --coral-accent: #FF7878;
            --ink-black: #111111;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            background-color: var(--header-wood);
            color: var(--ink-black);
            height: 100%;
            width: 100%;
            max-width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--desk-wood-base);
            background-image: linear-gradient(180deg, #5D3A22 0%, #8D5B3C 14%, #9C6746 50%, #7C4D30 100%);
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.6);
        }

        /* 상단 헤더: 메인 타이틀 중앙 + 우측 선택 인원 카운터만 배치 (블러 없음) */
        header {
            padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
            padding-bottom: 14px;
            padding-left: 16px;
            padding-right: 16px;
            background-color: var(--header-wood);
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 2px solid #271714;
            z-index: 20;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1.08rem;
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .selected-counter {
            position: absolute;
            right: 16px;
            bottom: 14px;
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--primary-lime);
        }

        .page {
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        .page.hidden {
            display: none !important;
        }

        .content-scroll {
            flex: 1;
            min-height: 0;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 14px 14px 140px 14px;
        }

        .swatch-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            width: 100%;
            margin: 0 auto;
        }

        .swatch-card {
            width: 100%;
            min-width: 0;
            background: #FAF8F5;
            border-radius: 6px;
            aspect-ratio: 1 / 1.04;
            padding: 5px 5px 6px 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
            box-shadow: 0 5px 10px rgba(30, 15, 5, 0.4);
            border: 1px solid #E2E8F0;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            transform-origin: center center;
        }

        .swatch-paper {
            width: 100%;
            height: 68%;
            border-radius: 3px;
            position: relative;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .swatch-label-box {
            height: 30%;
            width: 100%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 2px 2px 0 2px;
            background: #FAF8F5;
        }

        .swatch-code {
            font-size: 0.52rem;
            font-weight: 800;
            color: #555555;
            letter-spacing: 0.03em;
            line-height: 1.1;
        }

        .swatch-name {
            font-size: 0.74rem;
            font-weight: 900;
            color: #111111;
            letter-spacing: -0.04em;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        @keyframes stampShake {
            0%   { transform: scale(1.14) rotate(-4deg); }
            30%  { transform: scale(0.92) rotate(3deg); }
            55%  { transform: scale(1.03) rotate(-2deg); }
            75%  { transform: scale(0.98) rotate(1deg); }
            100% { transform: scale(1) rotate(-1deg); }
        }

        .swatch-card.selected {
            outline: 2.5px solid var(--primary-lime);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.48), 0 0 0 1.5px #3E2723;
            transform: rotate(-1deg);
        }

        .swatch-card.stamp-anim {
            animation: stampShake 0.36s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
        }

        .stamp-mark {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -65%) rotate(-14deg) scale(1.4);
            border: 2px solid #111111;
            color: #111111;
            background: #FFFFFF;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 0.58rem;
            font-weight: 900;
            letter-spacing: 0.06em;
            opacity: 0;
            pointer-events: none;
            transition: all 0.18s cubic-bezier(0.2, 0.9, 0.3, 1.3);
            z-index: 5;
        }

        .swatch-card.selected .stamp-mark {
            opacity: 1;
            transform: translate(-50%, -65%) rotate(-14deg) scale(1);
        }

        .result-badge {
            position: absolute;
            top: -7px;
            right: -6px;
            background: var(--coral-accent);
            color: #ffffff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.86rem;
            font-weight: 900;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.38);
            border: 2px solid #ffffff;
            z-index: 8;
            animation: badgePop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }

        @keyframes badgePop {
            0% { transform: scale(0) translateY(10px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .footer-action {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 14px calc(env(safe-area-inset-bottom, 0px) + 14px) 14px;
            background-color: var(--header-wood);
            border-top: 2px solid #271714;
            display: flex;
            flex-direction: column;
            gap: 7px;
            z-index: 15;
        }

        .footer-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .primary-btn {
            width: 100%;
            background: var(--primary-lime);
            color: #111111;
            border: none;
            border-radius: 13px;
            padding: 14px;
            font-size: 0.98rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s ease;
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        .sub-back-btn {
            width: 100%;
            background: #5D3A22;
            color: #FFF8E7;
            border: 1px solid #7C4D30;
            border-radius: 11px;
            padding: 10px;
            font-size: 0.86rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .result-nav-btn {
            flex: 1;
            padding: 14px 10px;
            border-radius: 13px;
            font-size: 0.94rem;
            font-weight: 800;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
        }

        .result-nav-btn.home {
            background: #FAF8F5;
            color: #111111;
        }

        .result-nav-btn.back {
            background: var(--primary-lime);
            color: #111111;
        }

        .snackbar {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 118px);
            left: 50%;
            transform: translateX(-50%) translateY(25px);
            width: calc(100% - 28px);
            background: #1E1B18;
            color: #FFFFFF;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
            z-index: 250;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .snackbar.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .snackbar-action {
            color: var(--primary-lime);
            background: none;
            border: none;
            font-weight: 900;
            font-size: 0.84rem;
            cursor: pointer;
            margin-left: 10px;
            white-space: nowrap;
        }

        .bottom-sheet-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s ease;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .bottom-sheet-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            width: 100%;
            background: #FAF8F5;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px 20px calc(env(safe-area-inset-bottom, 0px) + 26px) 20px;
            transform: translateY(100%);
            transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
        }

        .bottom-sheet-overlay.active .bottom-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 42px;
            height: 5px;
            background: #CBD5E1;
            border-radius: 3px;
            margin: 0 auto 14px auto;
        }

        .sheet-msg {
            font-size: 1.1rem;
            font-weight: 900;
            color: #111111;
            margin-bottom: 18px;
        }

        .shuffle-stage {
            position: absolute;
            inset: 0;
            background: rgba(39, 23, 20, 0.92);
            z-index: 150;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .shuffle-stage.active {
            opacity: 1;
            pointer-events: auto;
        }

        .shuffle-deck {
            position: relative;
            width: 120px;
            height: 135px;
            margin-bottom: 22px;
        }

        .shuffle-swatch {
            position: absolute;
            inset: 0;
            background: #FAF8F5;
            border-radius: 8px;
            padding: 7px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.45);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .shuffle-swatch-color {
            width: 100%;
            height: 72%;
            border-radius: 4px;
        }

        .shuffle-swatch-title {
            font-size: 0.78rem;
            font-weight: 900;
            color: #111111;
            text-align: left;
        }

        .shuffle-text {
            color: #FFF8E7;
            font-size: 1rem;
            font-weight: 800;
        }

        #confettiCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 120;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <canvas id="confettiCanvas"></canvas>

        <header>
            <div class="header-title" id="headerTitle">컬러 색상지 뽑기</div>
            <div class="selected-counter" id="selectedCounter">0명 선택</div>
        </header>

        <div class="page" id="selectPage">
            <div class="content-scroll">
                <div class="swatch-grid" id="swatchGrid"></div>
            </div>
            <div class="footer-action">
                <button class="primary-btn" onclick="openBottomSheet()">선택하기</button>
                <button class="sub-back-btn" onclick="triggerBackSnackbar()">↩ 뒤로가기 (컬렉션 홈)</button>
            </div>
        </div>

        <div class="page hidden" id="resultPage">
            <div class="content-scroll">
                <div class="swatch-grid" id="resultGrid"></div>
            </div>
            <div class="footer-action">
                <div class="footer-row">
                    <button class="result-nav-btn home" onclick="navigateHome()">🏠 홈으로 가기</button>
                    <button class="result-nav-btn back" onclick="goBackToSelect()">↩ 뒤로가기</button>
                </div>
            </div>
        </div>

        <div class="shuffle-stage" id="shuffleStage">
            <div class="shuffle-deck" id="shuffleDeck"></div>
            <div class="shuffle-text">컬러 색상지를 섞는 중입니다...</div>
        </div>

        <div class="bottom-sheet-overlay" id="bottomSheetOverlay" onclick="closeBottomSheet(event)">
            <div class="bottom-sheet" onclick="event.stopPropagation()">
                <div class="sheet-handle"></div>
                <div class="sheet-msg" id="sheetMsg">0명의 캐릭터 선택하였습니다.</div>
                <button class="primary-btn" onclick="startShuffleAndResult()">결과 보기</button>
            </div>
        </div>

        <div class="snackbar" id="snackbar">
            <span id="snackbarText">메인 컬렉션 화면으로 이동할까요?</span>
            <button class="snackbar-action" id="snackbarActionBtn" onclick="navigateHome()">이동하기</button>
        </div>
    </div>

    <script>
        const colorSwatches = [
            { id: 1,  code: 'CHIP 01', name: '애플 레드',     hex: '#E53935' },
            { id: 2,  code: 'CHIP 02', name: '선셋 오렌지',   hex: '#FB8C00' },
            { id: 3,  code: 'CHIP 03', name: '레몬 옐로우',   hex: '#FDD835' },
            { id: 4,  code: 'CHIP 04', name: '올리브 라임',   hex: '#82DC28' },
            { id: 5,  code: 'CHIP 05', name: '포레스트 그린', hex: '#2E7D32' },
            { id: 6,  code: 'CHIP 06', name: '민트 소다',     hex: '#26A69A' },
            { id: 7,  code: 'CHIP 07', name: '스카이 블루',   hex: '#29B6F6' },
            { id: 8,  code: 'CHIP 08', name: '코발트 블루',   hex: '#1E88E5' },
            { id: 9,  code: 'CHIP 09', name: '미드나잇 네이비', hex: '#283593' },
            { id: 10, code: 'CHIP 10', name: '라벤더 퍼플',   hex: '#8E24AA' },
            { id: 11, code: 'CHIP 11', name: '피치 코랄',     hex: '#FF7878' },
            { id: 12, code: 'CHIP 12', name: '버블검 핑크',   hex: '#EC407A' },
            { id: 13, code: 'CHIP 13', name: '밀크티 베이지', hex: '#D7CCC8' },
            { id: 14, code: 'CHIP 14', name: '카라멜 브라운', hex: '#6D4C41' },
            { id: 15, code: 'CHIP 15', name: '차콜 그레이',   hex: '#455A64' }
        ];

        let selectedIds = [];
        let lastStampedId = null;
        let snackbarTimer = null;

        function renderSwatches() {
            const grid = document.getElementById('swatchGrid');
            grid.innerHTML = '';

            colorSwatches.forEach(item => {
                const isSelected = selectedIds.includes(item.id);
                const isJustStamped = (lastStampedId === item.id);

                const card = document.createElement('div');
                card.className = `swatch-card ${isSelected ? 'selected' : ''} ${isJustStamped ? 'stamp-anim' : ''}`;
                card.onclick = () => toggleSwatch(item.id);

                card.innerHTML = `
                    <div class="stamp-mark">STAMPED</div>
                    <div class="swatch-paper" style="background-color: ${item.hex};"></div>
                    <div class="swatch-label-box">
                        <span class="swatch-code">${item.code}</span>
                        <span class="swatch-name">${item.name}</span>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('selectedCounter').innerText = `${selectedIds.length}명 선택`;
        }

        function toggleSwatch(id) {
            if (selectedIds.includes(id)) {
                selectedIds = selectedIds.filter(item => item !== id);
                lastStampedId = null;
            } else {
                selectedIds.push(id);
                lastStampedId = id;
            }
            renderSwatches();
        }

        function showSnackbar(message, showAction = true) {
            const bar = document.getElementById('snackbar');
            const text = document.getElementById('snackbarText');
            const actionBtn = document.getElementById('snackbarActionBtn');

            text.innerText = message;
            actionBtn.style.display = showAction ? 'inline-block' : 'none';
            bar.classList.add('show');

            if (snackbarTimer) clearTimeout(snackbarTimer);
            snackbarTimer = setTimeout(() => {
                bar.classList.remove('show');
            }, 3000);
        }

        function triggerBackSnackbar() {
            showSnackbar('이전 컬렉션 선택 화면으로 돌아갑니다.', true);
        }

        function navigateHome() {
            const path = window.location.pathname;
            if (path.includes('/color/')) {
                window.location.href = '../index.html';
            } else {
                window.location.href = 'index.html';
            }
        }

        function openBottomSheet() {
            if (selectedIds.length === 0) {
                showSnackbar('최소 1개 이상의 컬러 색상지를 선택해주세요!', false);
                return;
            }
            document.getElementById('sheetMsg').innerText = `${selectedIds.length}명의 컬러를 선택하였습니다.`;
            document.getElementById('bottomSheetOverlay').classList.add('active');
        }

        function closeBottomSheet(e) {
            if (e && e.target.id === 'bottomSheetOverlay') {
                document.getElementById('bottomSheetOverlay').classList.remove('active');
            }
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function startShuffleAndResult() {
            document.getElementById('bottomSheetOverlay').classList.remove('active');

            const stage = document.getElementById('shuffleStage');
            const deck = document.getElementById('shuffleDeck');
            deck.innerHTML = '';

            const previewIds = selectedIds.slice(0, 6);
            previewIds.forEach((id, idx) => {
                const item = colorSwatches.find(c => c.id === id);
                const el = document.createElement('div');
                el.className = 'shuffle-swatch';
                el.style.zIndex = idx;
                el.innerHTML = `
                    <div class="shuffle-swatch-color" style="background:${item.hex};"></div>
                    <div class="shuffle-swatch-title">${item.name}</div>
                `;
                deck.appendChild(el);
            });

            stage.classList.add('active');

            const cards = deck.querySelectorAll('.shuffle-swatch');
            let step = 0;
            const shuffleInterval = setInterval(() => {
                cards.forEach((card) => {
                    const randX = (Math.random() - 0.5) * 95;
                    const randY = (Math.random() - 0.5) * 35;
                    const randRot = (Math.random() - 0.5) * 32;
                    card.style.transform = `translate(${randX}px, ${randY}px) rotate(${randRot}deg)`;
                    card.style.zIndex = Math.floor(Math.random() * 10);
                });
                step++;
                if (step >= 4) {
                    clearInterval(shuffleInterval);
                    cards.forEach(card => {
                        card.style.transform = 'translate(0, 0) rotate(0deg) scale(1.04)';
                    });
                }
            }, 220);

            setTimeout(() => {
                stage.classList.remove('active');
                showResultPage();
            }, 1150);
        }

        function showResultPage() {
            const selectPage = document.getElementById('selectPage');
            const resultPage = document.getElementById('resultPage');
            const headerTitle = document.getElementById('headerTitle');

            selectPage.classList.add('hidden');
            headerTitle.innerText = '컬러 순서 결과';

            renderResultGrid();
            resultPage.classList.remove('hidden');
            launchConfetti();
        }

        // [핵심] 선택된 컬러들을 랜덤으로 섞은 뒤 A, B, C, D... 순서대로 정렬하여 표시
        function renderResultGrid() {
            const resultGrid = document.getElementById('resultGrid');
            resultGrid.innerHTML = '';

            // 선택한 컬러 ID 배열을 무작위로 섞음 -> 첫 번째가 A, 두 번째가 B, 세 번째가 C...
            const shuffledColorIds = shuffleArray(selectedIds);

            shuffledColorIds.forEach((id, index) => {
                const item = colorSwatches.find(c => c.id === id);
                const badgeLetter = String.fromCharCode(65 + index); // A, B, C, D 순서대로!

                const card = document.createElement('div');
                card.className = 'swatch-card selected';
                card.style.cursor = 'default';
                card.innerHTML = `
                    <div class="result-badge" style="animation-delay: ${index * 0.06}s">${badgeLetter}</div>
                    <div class="swatch-paper" style="background-color: ${item.hex};"></div>
                    <div class="swatch-label-box">
                        <span class="swatch-code">ORDER ${badgeLetter}</span>
                        <span class="swatch-name">${item.name}</span>
                    </div>
                `;
                resultGrid.appendChild(card);
            });
        }

        function goBackToSelect() {
            const selectPage = document.getElementById('selectPage');
            const resultPage = document.getElementById('resultPage');
            const headerTitle = document.getElementById('headerTitle');

            resultPage.classList.add('hidden');
            headerTitle.innerText = '컬러 색상지 뽑기';
            lastStampedId = null;
            selectPage.classList.remove('hidden');
        }

        function launchConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            const colors = ['#82DC28', '#FF7878', '#FDD835', '#29B6F6', '#AB47BC', '#FFFFFF'];
            const pieces = Array.from({ length: 75 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * -canvas.height * 0.5,
                w: Math.random() * 9 + 5,
                h: Math.random() * 6 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                vy: Math.random() * 3.5 + 2.2,
                vx: (Math.random() - 0.5) * 2.5,
                angle: Math.random() * 360,
                spin: (Math.random() - 0.5) * 8
            }));

            let frame = 0;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.y += p.vy;
                    p.x += p.vx;
                    p.angle += p.spin;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.angle * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                });
                frame++;
                if (frame < 150) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            animate();
        }

        window.onload = () => {
            renderSwatches();
        };
    </script>
</body>
