<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>휴게시간 순서뽑기 - 치이카와 테마</title>

    <!-- 폰트 프리커넥트 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">

    <!-- [속도 극대화] 첫 화면에 바로 보이는 img/1.png ~ img/9.png 최우선 프리로드 -->
    <link rel="preload" as="image" href="img/1.png" fetchpriority="high">
    <link rel="preload" as="image" href="img/2.png" fetchpriority="high">
    <link rel="preload" as="image" href="img/3.png" fetchpriority="high">
    <link rel="preload" as="image" href="img/4.png" fetchpriority="high">
    <link rel="preload" as="image" href="img/5.png" fetchpriority="high">
    <link rel="preload" as="image" href="img/6.png" fetchpriority="high">
    <link rel="preload" as="image" href="img/7.png" fetchpriority="high">
    <link rel="preload" as="image" href="img/8.png" fetchpriority="high">
    <link rel="preload" as="image" href="img/9.png" fetchpriority="high">

    <style>
        :root {
            --primary: #82DC28;
            --primary-hover: #72c722;
            --coral: #FF7878;
            --text-main: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            background-color: #b8e2f2;
            color: var(--text-main);
            height: 100%;
            width: 100%;
            max-width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* 모바일 컨테이너: 초원 배경 세로 확장 */
        .mobile-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: linear-gradient(180deg, #b8e2f2 0%, #dcf0f9 25%, #cde6ba 25.2%, #c9e3b4 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 28px rgba(0, 0, 0, 0.25);
        }

        .scenery-layer {
            position: absolute;
            top: 13%;
            left: 0;
            width: 100%;
            height: 14%;
            pointer-events: none;
            z-index: 0;
        }

        /* 상단 헤더: 블러 없음, 메인 타이틀 중앙 + 우측 선택 인원 카운터만 배치 */
        header {
            padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
            padding-bottom: 14px;
            padding-left: 18px;
            padding-right: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #ffffff;
            border-bottom: 2px solid #e2e8f0;
            z-index: 20;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1.08rem;
            font-weight: 900;
            color: var(--text-main);
            text-align: center;
        }

        .selected-counter {
            position: absolute;
            right: 18px;
            bottom: 14px;
            font-size: 0.82rem;
            font-weight: 800;
            color: #4d9a0f;
        }

        /* 치이카와 캐릭터 한마디 말풍선 토스트 */
        .quote-toast {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 58px);
            left: 50%;
            transform: translateX(-50%) translateY(-12px) scale(0.95);
            background: #ffffff;
            border: 2.5px solid var(--coral);
            border-radius: 999px;
            padding: 7px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
            z-index: 35;
            opacity: 0;
            pointer-events: none;
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
        }

        .quote-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .quote-speaker {
            background: var(--coral);
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 999px;
        }

        .quote-text {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--text-main);
        }

        /* 우측 하단 BGM 플로팅 캡슐 */
        .bgm-pill {
            position: absolute;
            right: 14px;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
            background: #ffffff;
            color: var(--text-main);
            border: 2px solid #cbd5e1;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.74rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .bgm-pill.playing {
            border-color: var(--primary);
            background: #f7fee7;
            color: #365314;
        }

        .bgm-pill:active {
            transform: scale(0.94);
        }

        .page {
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        .page.hidden {
            display: none !important;
        }

        .content-scroll {
            flex: 1;
            min-height: 0;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 18px 14px 135px 14px;
        }

        /* 3x5 격자 배치 */
        .grid-3x5 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            width: 100%;
            margin: 0 auto;
        }

        /* 하얀 바탕 라운드 1:1 정사각형 카드 */
        .char-card {
            width: 100%;
            min-width: 0;
            background: #ffffff;
            border-radius: 20px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 6px 6px 6px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.07);
            border: 3px solid transparent;
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.18s ease, box-shadow 0.18s ease;
        }

        @keyframes jellyPop {
            0%   { transform: scale(0.9); }
            45%  { transform: scale(1.06) translateY(-4px); }
            75%  { transform: scale(0.98) translateY(-2px); }
            100% { transform: scale(1) translateY(-3px); }
        }

        .char-card:active {
            transform: scale(0.93);
        }

        .char-card.selected {
            border-color: var(--primary);
            box-shadow: 0 8px 18px rgba(130, 220, 40, 0.35);
            transform: translateY(-3px);
        }

        .char-card.just-clicked {
            animation: jellyPop 0.32s ease forwards;
        }

        .select-check {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary);
            color: #1e293b;
            font-size: 0.75rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.4);
            transition: all 0.2s ease;
            z-index: 4;
        }

        .char-card.selected .select-check {
            opacity: 1;
            transform: scale(1);
        }

        /* 파스텔 쉬머 스켈레톤(Skeleton) + 부드러운 페이드인 */
        .char-img-box {
            width: 76%;
            aspect-ratio: 1 / 1;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: var(--skel-bg, #f1f5f9);
        }

        @keyframes skeletonWave {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes pulseSilhouette {
            0%, 100% { transform: scale(0.94); opacity: 0.45; }
            50%      { transform: scale(1.04); opacity: 0.75; }
        }

        .skeleton-loader {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--skel-bg, #f1f5f9);
            z-index: 2;
            transition: opacity 0.22s ease;
            overflow: hidden;
        }

        .skeleton-loader::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.65) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            animation: skeletonWave 1.1s infinite;
        }

        .skeleton-ears {
            width: 38px;
            height: 38px;
            fill: #ffffff;
            animation: pulseSilhouette 1.2s ease-in-out infinite;
        }

        .char-img-box.loaded .skeleton-loader {
            opacity: 0;
            pointer-events: none;
        }

        .char-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.92);
            transition: opacity 0.24s ease, transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 3;
        }

        .char-img-box.loaded img {
            opacity: 1;
            transform: scale(1);
        }

        .char-name {
            font-size: 0.76rem;
            font-weight: 800;
            color: var(--text-main);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* 우측 상단 알파벳 배지 + 바운스 등장 애니메이션 */
        @keyframes badgeBounceIn {
            0%   { opacity: 0; transform: scale(0.2) translateY(-28px); }
            45%  { opacity: 1; transform: scale(1.28) translateY(4px); }
            65%  { transform: scale(0.88) translateY(-5px); }
            82%  { transform: scale(1.08) translateY(2px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes badgeIdleBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50%      { transform: translateY(-4px) scale(1.06); }
        }

        .result-badge {
            position: absolute;
            top: -8px;
            right: -7px;
            background: var(--coral);
            color: #ffffff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.92rem;
            font-weight: 900;
            box-shadow: 0 4px 10px rgba(255, 82, 82, 0.45);
            border: 2.5px solid #ffffff;
            z-index: 10;
            opacity: 0;
            animation: 
                badgeBounceIn 0.65s cubic-bezier(0.28, 0.84, 0.42, 1) forwards,
                badgeIdleBounce 1.8s ease-in-out 0.7s infinite;
        }

        /* 하단 고정 버튼 영역 */
        .footer-action {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 18px) 16px;
            background-color: #ffffff;
            border-top: 2px solid #e2e8f0;
            display: flex;
            gap: 10px;
            justify-content: center;
            z-index: 15;
        }

        .action-btn {
            flex: 1;
            background: var(--primary);
            color: #1e293b;
            border: none;
            border-radius: 14px;
            padding: 15px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
        }

        .action-btn.home-sub {
            flex: 0.45;
            background: #f1f5f9;
            color: var(--text-main);
        }

        /* 바텀시트 모달 */
        .bottom-sheet-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .bottom-sheet-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            width: 100%;
            background: #ffffff;
            border-top-left-radius: 26px;
            border-top-right-radius: 26px;
            padding: 22px 24px calc(env(safe-area-inset-bottom, 0px) + 30px) 24px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
        }

        .bottom-sheet-overlay.active .bottom-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 42px;
            height: 5px;
            background: #cbd5e1;
            border-radius: 3px;
            margin: 0 auto 18px auto;
        }

        .sheet-msg {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 22px;
        }

        #confettiCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 90;
        }
    </style>
</head>
<body>

    <div class="mobile-container" onclick="ensureBgmStartedOnce()">
        <canvas id="confettiCanvas"></canvas>

        <svg class="scenery-layer" viewBox="0 0 480 120" preserveAspectRatio="none">
            <path d="M0,90 L85,35 L190,85 L330,28 L460,85 L480,75 L480,120 L0,120 Z" fill="#b7b1cb" stroke="#6d5959" stroke-width="3"/>
            <path d="M0,95 Q20,65 45,88 Q70,55 100,88 Q135,60 165,90 Q205,45 245,88 Q280,65 315,90 Q355,55 395,88 Q435,60 480,85 L480,120 L0,120 Z" fill="#88b872" stroke="#5c4938" stroke-width="3"/>
            <rect x="0" y="96" width="480" height="8" fill="#eef7df"/>
        </svg>

        <header>
            <div class="header-title" id="headerTitle">치이카와 선택하기</div>
            <div class="selected-counter" id="selectedCounter">0명 선택</div>
        </header>

        <!-- 캐릭터 클릭 시 귀여운 대사 토스트 -->
        <div class="quote-toast" id="quoteToast">
            <span class="quote-speaker" id="quoteSpeaker">치이카와</span>
            <span class="quote-text" id="quoteText">"와...!! 에-!"</span>
        </div>

        <!-- 우측 하단 BGM 컨트롤 플로팅 버튼 -->
        <button class="bgm-pill playing" id="bgmToggleBtn" onclick="event.stopPropagation(); toggleBgm();">
            🎵 BGM ON
        </button>

        <div class="page" id="selectPage">
            <div class="content-scroll">
                <div class="grid-3x5" id="chiikawaGrid"></div>
            </div>
            <div class="footer-action">
                <button class="action-btn home-sub" onclick="navigateHome()">🏠 홈으로</button>
                <button class="action-btn" onclick="openBottomSheet()">선택하기</button>
            </div>
        </div>

        <div class="page hidden" id="resultPage">
            <div class="content-scroll">
                <div class="grid-3x5" id="resultGrid"></div>
            </div>
            <div class="footer-action">
                <button class="action-btn home-sub" onclick="navigateHome()">🏠 홈으로</button>
                <button class="action-btn" onclick="goBack()">🔄 다시 뽑기</button>
            </div>
        </div>

        <div class="bottom-sheet-overlay" id="bottomSheetOverlay" onclick="closeBottomSheet(event)">
            <div class="bottom-sheet" onclick="event.stopPropagation()">
                <div class="sheet-handle"></div>
                <div class="sheet-msg" id="sheetMsg">0명의 캐릭터 선택하였습니다.</div>
                <button class="action-btn" style="width:100%;" onclick="confirmSelection()">결과 보기</button>
            </div>
        </div>
    </div>

    <script>
        const chiikawaCharacters = [
            { id: 1,  name: '치이카와',       color: '#FFE4E8', quote: '와...!! 에-! 으앙~!',           freq: 659.25 },
            { id: 2,  name: '하치와레',       color: '#DDF0FF', quote: '어라?! 어떻게든 되겠지~!',      freq: 587.33 },
            { id: 3,  name: '우사기',         color: '#FFF3B8', quote: '우라-!! 야하-!! 푸루야~!',       freq: 783.99 },
            { id: 4,  name: '랏코',           color: '#EDE4DC', quote: '강해지고 싶나? 달콤한 파르페 최고!', freq: 440.00 },
            { id: 5,  name: '쿠리만쥬',       color: '#FFE0B2', quote: '하아ー... 크으~!',              freq: 392.00 },
            { id: 6,  name: '시사',           color: '#FFF199', quote: '스승님~! 열심히 일하겠습니다!',  freq: 698.46 },
            { id: 7,  name: '모몽가',         color: '#F0DDF8', quote: '봐라 봐라! 귀여운 척 좀 해봤다!', freq: 739.99 },
            { id: 8,  name: '카니',           color: '#FFD1D6', quote: '모몽가랑 같이 헌책방 갈래~!',    freq: 659.25 },
            { id: 9,  name: '파자마 파티즈',  color: '#DCF5E0', quote: '우와와 우와~ 파자마 파티~♪',     freq: 880.00 },
            { id: 10, name: '풍뎅이',         color: '#E6DAD2', quote: '부스스... 찹쌀떡처럼 말랑말랑~',  freq: 830.61 },
            { id: 11, name: '고블린',         color: '#D2F0D4', quote: '감옥에서 탈출?! 버섯 볶음 먹자!', freq: 493.88 },
            { id: 12, name: '포쉐트 갑옷 씨', color: '#DCE4E8', quote: '직접 만든 귀여운 파자마 어때?',   freq: 349.23 },
            { id: 13, name: '세이렌',         color: '#C8F2F8', quote: '랄랄라~ 내 노래를 들어줘~♪',     freq: 783.99 },
            { id: 14, name: '아노코',         color: '#FADCE8', quote: '쿵... 쿵... (해맑은 미소)',      freq: 329.63 },
            { id: 15, name: '꿀맛맨',         color: '#FFE590', quote: '이거 정말 꿀맛이로구나~!!',      freq: 523.25 }
        ];

        let selectedIds = [];
        let quoteTimer = null;

        function createFallbackSVG(char) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <rect width="100" height="100" rx="22" fill="${char.color}"/>
                <circle cx="50" cy="54" r="30" fill="#ffffff" stroke="#475569" stroke-width="3.5"/>
                <circle cx="33" cy="30" r="10" fill="#ffffff" stroke="#475569" stroke-width="3.5"/>
                <circle cx="67" cy="30" r="10" fill="#ffffff" stroke="#475569" stroke-width="3.5"/>
                <circle cx="40" cy="52" r="3.5" fill="#1e293b"/>
                <circle cx="60" cy="52" r="3.5" fill="#1e293b"/>
                <ellipse cx="32" cy="58" rx="5" ry="3" fill="#fda4af"/>
                <ellipse cx="68" cy="58" rx="5" ry="3" fill="#fda4af"/>
                <path d="M 45 60 Q 50 65 55 60" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
            </svg>`;
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        // [핵심] 모든 이미지를 불필요한 404 탐색 없이 img/${id}.png 에서 다이렉트로 즉시 로드!
        function loadCharacterImageDirect(imgEl, boxEl, char) {
            imgEl.onload = function() {
                boxEl.classList.add('loaded');
            };
            imgEl.onerror = function() {
                // 혹시 확장자가 .jpg 인 경우만 1회 확인 후 바로 SVG 폴백
                if (!imgEl.dataset.triedJpg) {
                    imgEl.dataset.triedJpg = '1';
                    imgEl.src = `img/${char.id}.jpg`;
                } else {
                    imgEl.onerror = null;
                    imgEl.src = createFallbackSVG(char);
                    boxEl.classList.add('loaded');
                }
            };

            imgEl.decoding = 'async';
            if (char.id <= 9) {
                imgEl.fetchPriority = 'high';
            }
            imgEl.src = `img/${char.id}.png`;
        }

        function getSkeletonHTML() {
            return `
                <div class="skeleton-loader">
                    <svg class="skeleton-ears" viewBox="0 0 64 64">
                        <circle cx="20" cy="20" r="8"/>
                        <circle cx="44" cy="20" r="8"/>
                        <circle cx="32" cy="36" r="18"/>
                    </svg>
                </div>
            `;
        }

        function initGridOnce() {
            const grid = document.getElementById('chiikawaGrid');
            grid.innerHTML = '';

            chiikawaCharacters.forEach(char => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.id = `chiikawa-card-${char.id}`;
                card.onclick = () => toggleSelect(char);

                card.innerHTML = `
                    <div class="select-check">✓</div>
                    <div class="char-img-box" style="--skel-bg: ${char.color};">
                        ${getSkeletonHTML()}
                        <img alt="${char.name}">
                    </div>
                    <div class="char-name">${char.name}</div>
                `;
                grid.appendChild(card);

                const boxEl = card.querySelector('.char-img-box');
                const imgEl = card.querySelector('img');
                loadCharacterImageDirect(imgEl, boxEl, char);
            });
        }

        function updateSelectionUI(justClickedId = null) {
            chiikawaCharacters.forEach(char => {
                const card = document.getElementById(`chiikawa-card-${char.id}`);
                if (!card) return;

                if (selectedIds.includes(char.id)) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }

                card.classList.remove('just-clicked');
                if (justClickedId === char.id) {
                    void card.offsetWidth;
                    card.classList.add('just-clicked');
                }
            });

            document.getElementById('selectedCounter').innerText = `${selectedIds.length}명 선택`;
        }

        // =========================================================
        // 사운드 & 먼작귀풍 배경음악(BGM) 엔진
        // =========================================================
        let audioCtx = null;
        let soundEnabled = true;
        let bgmStarted = false;
        let bgmLoopTimer = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        const chiikawaMelody = [
            { note: 523.25, bass: 261.63, dur: 0.22 },
            { note: 659.25, bass: 0,      dur: 0.22 },
            { note: 783.99, bass: 392.00, dur: 0.22 },
            { note: 1046.50,bass: 0,      dur: 0.32 },
            { note: 880.00, bass: 349.23, dur: 0.22 },
            { note: 783.99, bass: 0,      dur: 0.22 },
            { note: 659.25, bass: 392.00, dur: 0.28 },
            { note: 0,      bass: 0,      dur: 0.14 },
            { note: 698.46, bass: 349.23, dur: 0.22 },
            { note: 880.00, bass: 0,      dur: 0.22 },
            { note: 783.99, bass: 392.00, dur: 0.22 },
            { note: 659.25, bass: 0,      dur: 0.22 },
            { note: 587.33, bass: 293.66, dur: 0.22 },
            { note: 698.46, bass: 0,      dur: 0.22 },
            { note: 659.25, bass: 392.00, dur: 0.22 },
            { note: 587.33, bass: 0,      dur: 0.26 },
            { note: 523.25, bass: 261.63, dur: 0.22 },
            { note: 659.25, bass: 0,      dur: 0.22 },
            { note: 783.99, bass: 392.00, dur: 0.22 },
            { note: 659.25, bass: 0,      dur: 0.22 },
            { note: 880.00, bass: 349.23, dur: 0.26 },
            { note: 783.99, bass: 0,      dur: 0.22 },
            { note: 698.46, bass: 293.66, dur: 0.22 },
            { note: 659.25, bass: 0,      dur: 0.22 },
            { note: 587.33, bass: 392.00, dur: 0.20 },
            { note: 659.25, bass: 0,      dur: 0.20 },
            { note: 698.46, bass: 392.00, dur: 0.20 },
            { note: 783.99, bass: 0,      dur: 0.24 },
            { note: 1046.50,bass: 261.63, dur: 0.42 },
            { note: 0,      bass: 0,      dur: 0.30 }
        ];

        let melodyStep = 0;

        function playSynthBgmStep() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const step = chiikawaMelody[melodyStep];
            const now = audioCtx.currentTime;

            if (step.note > 0) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(step.note, now);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.055, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + step.dur);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + step.dur + 0.02);
            }

            if (step.bass > 0) {
                const bOsc = audioCtx.createOscillator();
                const bGain = audioCtx.createGain();
                bOsc.type = 'triangle';
                bOsc.frequency.setValueAtTime(step.bass, now);

                bGain.gain.setValueAtTime(0.001, now);
                bGain.gain.linearRampToValueAtTime(0.035, now + 0.015);
                bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

                bOsc.connect(bGain);
                bGain.connect(audioCtx.destination);
                bOsc.start(now);
                bOsc.stop(now + 0.2);
            }

            melodyStep = (melodyStep + 1) % chiikawaMelody.length;
            bgmLoopTimer = setTimeout(playSynthBgmStep, step.dur * 1000);
        }

        function startBgm() {
            if (!soundEnabled || bgmStarted) return;
            bgmStarted = true;
            if (bgmLoopTimer) clearTimeout(bgmLoopTimer);
            playSynthBgmStep();
        }

        function stopBgm() {
            bgmStarted = false;
            if (bgmLoopTimer) {
                clearTimeout(bgmLoopTimer);
                bgmLoopTimer = null;
            }
        }

        function ensureBgmStartedOnce() {
            if (soundEnabled && !bgmStarted) {
                startBgm();
            }
        }

        function toggleBgm() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('bgmToggleBtn');
            if (soundEnabled) {
                btn.innerText = '🎵 BGM ON';
                btn.classList.add('playing');
                startBgm();
            } else {
                btn.innerText = '🔇 BGM OFF';
                btn.classList.remove('playing');
                stopBgm();
            }
        }

        function playChiikawaClickSound(char, isSelecting) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (isSelecting) {
                const baseFreq = char.freq || 659.25;
                osc.type = 'sine';
                osc.frequency.setValueAtTime(baseFreq * 0.75, now);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.35, now + 0.11);

                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.008, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.16);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, now);
                osc.frequency.exponentialRampToValueAtTime(320, now + 0.08);

                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.008, now + 0.09);
                osc.start(now);
                osc.stop(now + 0.1);
            }
        }

        function playSheetOpenSound() {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            [659.25, 880.00].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + i * 0.07);
                gain.gain.setValueAtTime(0.14, now + i * 0.07);
                gain.gain.exponentialRampToValueAtTime(0.008, now + i * 0.07 + 0.16);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.07);
                osc.stop(now + i * 0.07 + 0.17);
            });
        }

        function playResultFanfare(badgeCount) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const fanfareNotes = [
                { f: 523.25, t: 0.00, d: 0.12 },
                { f: 659.25, t: 0.09, d: 0.12 },
                { f: 783.99, t: 0.18, d: 0.12 },
                { f: 1046.50,t: 0.27, d: 0.22 },
                { f: 783.99, t: 0.44, d: 0.12 },
                { f: 1046.50,t: 0.55, d: 0.45 }
            ];

            fanfareNotes.forEach(n => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(n.f, now + n.t);
                gain.gain.setValueAtTime(0.2, now + n.t);
                gain.gain.exponentialRampToValueAtTime(0.008, now + n.t + n.d);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + n.t);
                osc.stop(now + n.t + n.d + 0.02);
            });

            const maxPop = Math.min(badgeCount, 10);
            for (let i = 0; i < maxPop; i++) {
                const delay = i * 0.08 + 0.15;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880 + i * 65, now + delay);
                gain.gain.setValueAtTime(0.08, now + delay);
                gain.gain.exponentialRampToValueAtTime(0.005, now + delay + 0.09);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + delay);
                osc.stop(now + delay + 0.1);
            }
        }

        function showCharacterQuote(char) {
            const toast = document.getElementById('quoteToast');
            const speaker = document.getElementById('quoteSpeaker');
            const text = document.getElementById('quoteText');

            speaker.innerText = char.name;
            text.innerText = `"${char.quote}"`;
            toast.classList.add('show');

            if (quoteTimer) clearTimeout(quoteTimer);
            quoteTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        function toggleSelect(char) {
            ensureBgmStartedOnce();

            if (selectedIds.includes(char.id)) {
                selectedIds = selectedIds.filter(i => i !== char.id);
                playChiikawaClickSound(char, false);
                updateSelectionUI(null);
            } else {
                selectedIds.push(char.id);
                playChiikawaClickSound(char, true);
                showCharacterQuote(char);
                updateSelectionUI(char.id);
            }
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function openBottomSheet() {
            ensureBgmStartedOnce();
            if (selectedIds.length === 0) {
                alert('최소 1명 이상의 캐릭터를 선택해주세요!');
                return;
            }
            playSheetOpenSound();
            document.getElementById('sheetMsg').innerText = `${selectedIds.length}명의 캐릭터 선택하였습니다.`;
            document.getElementById('bottomSheetOverlay').classList.add('active');
        }

        function closeBottomSheet(e) {
            if (e && e.target.id === 'bottomSheetOverlay') {
                document.getElementById('bottomSheetOverlay').classList.remove('active');
            }
        }

        function confirmSelection() {
            document.getElementById('bottomSheetOverlay').classList.remove('active');

            const selectPage = document.getElementById('selectPage');
            const resultPage = document.getElementById('resultPage');
            const headerTitle = document.getElementById('headerTitle');

            selectPage.classList.add('hidden');
            headerTitle.innerText = '치이카와 순서 결과';

            renderResultGrid();
            resultPage.classList.remove('hidden');

            playResultFanfare(selectedIds.length);
            launchConfetti();
        }

        function renderResultGrid() {
            const resultGrid = document.getElementById('resultGrid');
            resultGrid.innerHTML = '';

            const shuffledCharIds = shuffleArray(selectedIds);

            shuffledCharIds.forEach((id, index) => {
                const char = chiikawaCharacters.find(c => c.id === id);
                const badgeLetter = String.fromCharCode(65 + index);
                const delay = (index * 0.08).toFixed(2);

                const card = document.createElement('div');
                card.className = 'char-card selected';
                card.onclick = () => {
                    playChiikawaClickSound(char, true);
                    showCharacterQuote(char);
                };
                card.innerHTML = `
                    <div class="result-badge" style="animation-delay: ${delay}s, ${parseFloat(delay) + 0.65}s">${badgeLetter}</div>
                    <div class="char-img-box" style="--skel-bg: ${char.color};">
                        ${getSkeletonHTML()}
                        <img alt="${char.name}">
                    </div>
                    <div class="char-name">${char.name}</div>
                `;
                resultGrid.appendChild(card);

                const boxEl = card.querySelector('.char-img-box');
                const imgEl = card.querySelector('img');
                loadCharacterImageDirect(imgEl, boxEl, char);
            });
        }

        function goBack() {
            const selectPage = document.getElementById('selectPage');
            const resultPage = document.getElementById('resultPage');
            const headerTitle = document.getElementById('headerTitle');

            resultPage.classList.add('hidden');
            headerTitle.innerText = '치이카와 선택하기';
            selectPage.classList.remove('hidden');
        }

        function navigateHome() {
            const path = window.location.pathname;
            if (path.includes('/chiikawa/')) {
                window.location.href = '../index.html';
            } else {
                window.location.href = 'index.html';
            }
        }

        function launchConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            const colors = ['#FF7878', '#82DC28', '#FFF176', '#81D4FA', '#F48FB1', '#FFFFFF'];
            const pieces = Array.from({ length: 65 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * -canvas.height * 0.4,
                w: Math.random() * 8 + 5,
                h: Math.random() * 6 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                vy: Math.random() * 3.2 + 2.0,
                vx: (Math.random() - 0.5) * 2.2,
                angle: Math.random() * 360,
                spin: (Math.random() - 0.5) * 7
            }));

            let frame = 0;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    p.y += p.vy;
                    p.x += p.vx;
                    p.angle += p.spin;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.angle * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                });
                frame++;
                if (frame < 140) {
                    requestAnimationFrame(animate);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            animate();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initGridOnce);
        } else {
            initGridOnce();
        }
    </script>
