<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>산리오 캐릭터즈 휴게시간 순서뽑기</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #FFF7FA;
      --surface: #FFFFFF;
      --primary: #FF7898;
      --primary-dark: #E85B7E;
      --accent: #82DC28;
      --text-main: #2B2428;
      --text-sub: #7A6E74;
      --border: #F5DCE4;
      --shadow-clay: 0 8px 20px rgba(255, 120, 152, 0.14), inset 0 -3px 6px rgba(255, 120, 152, 0.08);
      --shadow-card: 0 4px 12px rgba(43, 36, 40, 0.06);
      --radius-lg: 22px;
      --radius-md: 14px;
      --grid-cols: 3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overscroll-behavior-x: none;
      touch-action: pan-y;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #FFF3F8 0%, #F9FBFF 100%);
      color: var(--text-main);
      min-height: 100dvh;
      padding: 16px 12px calc(env(safe-area-inset-bottom, 0px) + 40px);
    }

    .app-container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      overflow-x: hidden;
    }

    /* ===== 상단 헤더 ===== */
    .header {
      position: relative;
      text-align: center;
      margin-bottom: 16px;
      padding: 0 44px;
    }

    .sound-toggle {
      position: absolute;
      top: 0;
      right: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .sound-toggle:active {
      transform: scale(0.92);
    }

    .sound-toggle.muted {
      background: #F4F1F3;
      opacity: 0.7;
    }

    .header-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFE5EE;
      color: var(--primary-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
    }

    .header p {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    /* ===== 상단 결과 카드 섹션 ===== */
    .result-section {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-clay);
      overflow: hidden;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }

    .result-title {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .result-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary-dark);
      background: #FFF0F5;
      padding: 4px 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }

    .result-empty {
      text-align: center;
      padding: 20px 10px;
      font-size: 13px;
      color: var(--text-sub);
      background: #FFF9FB;
      border: 1.5px dashed #F3CFD9;
      border-radius: 14px;
    }

    /* 결과 카드 영역: 모바일 2x2 비율 & 가로 중앙 정렬 */
    .result-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .result-card {
      position: relative;
      width: calc((100% - 10px) / 2);
      max-width: 190px;
      aspect-ratio: 1 / 1;
      background: #FFF9FB;
      border: 2px solid #FFD6E2;
      border-radius: 14px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 0;
      transform: translateY(10px) scale(0.92);
      animation: popIn 0.42s cubic-bezier(0.22, 1.25, 0.36, 1) forwards;
    }

    .result-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @keyframes popIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ===== 오른쪽 상단 ABCD 배지 (클래스 내부 안전 배치) ===== */
    .order-badge {
      position: absolute;
      top: 5px;
      right: 5px;
      min-width: 28px;
      height: 28px;
      padding: 0 7px;
      border-radius: 999px;
      background: linear-gradient(135deg, #FF7898, #FF4F7B);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(255, 79, 123, 0.4);
      border: 2px solid #FFFFFF;
      z-index: 10;
      letter-spacing: -0.02em;
      pointer-events: none;
    }

    /* ===== 컨트롤 버튼 바 ===== */
    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      margin-bottom: 16px;
      width: 100%;
    }

    .btn {
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      padding: 13px 14px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, #FF7898 0%, #FF5780 100%);
      color: #FFFFFF;
      box-shadow: 0 6px 14px rgba(255, 87, 128, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background: #FFFFFF;
      color: var(--text-main);
      border: 1.5px solid var(--border);
    }

    /* ===== 캐릭터 선택 헤더 & PC/태블릿 배열 조절 ===== */
    .grid-section-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 10px;
      padding: 0 2px;
      width: 100%;
    }

    .grid-label-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .grid-label-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* PC/태블릿 전용 배열 조정 컨트롤 (모바일 숨김) */
    .layout-controls {
      display: none;
      align-items: center;
      gap: 4px;
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      padding: 3px;
      border-radius: 999px;
    }

    .layout-btn {
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .layout-btn.active {
      background: var(--primary);
      color: #FFFFFF;
    }

    .btn-shuffle {
      border: 1.5px solid var(--border);
      background: #FFFFFF;
      color: var(--primary-dark);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .btn-shuffle:active {
      transform: scale(0.94);
      background: #FFF0F5;
    }

    /* ===== 캐릭터 선택 그리드 (패딩 0, 클래스 이탈 방지) ===== */
    .character-grid {
      display: grid;
      grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .char-card {
      position: relative;
      width: 100%;
      min-width: 0;
      background: var(--surface);
      border: 2.5px solid transparent;
      border-radius: var(--radius-md);
      aspect-ratio: 1 / 1;
      padding: 0;
      box-shadow: var(--shadow-card);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .char-card:active {
      transform: scale(0.96);
    }

    .char-card.selected {
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(255, 120, 152, 0.3);
    }

    .select-check {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.18s cubic-bezier(0.22, 1.3, 0.36, 1);
      z-index: 6;
      border: 2px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(130, 220, 40, 0.45);
      pointer-events: none;
    }

    .char-card.selected .select-check {
      opacity: 1;
      transform: scale(1);
    }

    /* ===== 스켈레톤 로딩 애니메이션 ===== */
    .skeleton {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        #F4EBF0 25%,
        #FFFFFF 45%,
        #F4EBF0 65%
      );
      background-size: 220% 100%;
      animation: shimmer 1.3s ease-in-out infinite;
      z-index: 2;
      transition: opacity 0.35s ease;
    }

    .skeleton.hidden {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    .char-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.38s ease, transform 0.38s cubic-bezier(0.22, 1.2, 0.36, 1);
      z-index: 1;
    }

    .char-img.loaded {
      opacity: 1;
      transform: scale(1);
    }

    .img-fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: #FFF5F8;
      color: #C799AA;
      font-size: 11px;
      font-weight: 700;
      gap: 4px;
      z-index: 1;
    }

    .img-fallback span {
      font-size: 22px;
    }

    /* ===== 컨페티 캔버스 ===== */
    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    /* ===== 토스트 메시지 ===== */
    .toast {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(43, 36, 40, 0.92);
      backdrop-filter: blur(8px);
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      z-index: 1000;
      white-space: nowrap;
      max-width: calc(100vw - 24px);
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      transition: transform 0.35s cubic-bezier(0.22, 1.25, 0.36, 1), opacity 0.3s ease;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ===== 태블릿 & PC 반응형 (MAX 너비 960px, 배열 조절 노출) ===== */
    @media (min-width: 640px) {
      body {
        padding: 28px 24px 56px;
      }

      .app-container {
        max-width: 960px;
      }

      .header h1 {
        font-size: 28px;
      }

      .layout-controls {
        display: inline-flex;
      }

      .character-grid {
        gap: 12px;
      }

      .result-grid {
        gap: 14px;
      }

      .result-card {
        width: calc((100% - 42px) / 4);
        max-width: 185px;
      }
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <div id="toast" class="toast" role="status" aria-live="polite">🎉 순서뽑기 결과가 나왔습니다.</div>

  <div class="app-container">
    <!-- 1. 헤드 타이틀 + 효과음 토글 -->
    <header class="header">
      <button class="sound-toggle" id="soundToggle" aria-label="효과음 켜기/끄기" title="효과음 켜기/끄기">🔊</button>
      <div class="header-pill">🎀 SANRIO CHARACTERS</div>
      <h1>휴게시간 순서뽑기</h1>
      <p>참여할 캐릭터를 선택하고 순서를 뽑아보세요!</p>
    </header>

    <!-- 2. 상단 결과 카드 영역 (A, B, C, D 순서 / 가로 중앙 정렬) -->
    <section class="result-section" aria-label="순서뽑기 결과">
      <div class="result-header">
        <div class="result-title">✨ 순서뽑기 결과 (A → Z)</div>
        <div class="result-count" id="resultCount">선택 0명</div>
      </div>
      <div id="resultBody">
        <div class="result-empty">아래에서 캐릭터를 선택한 뒤 <b>순서 뽑기</b>를 눌러주세요.</div>
      </div>
    </section>

    <!-- 3. 액션 버튼 -->
    <div class="controls">
      <button class="btn btn-primary" id="drawBtn" disabled>🎲 순서 뽑기</button>
      <button class="btn btn-secondary" id="selectAllBtn">전체</button>
      <button class="btn btn-secondary" id="resetBtn">초기화</button>
    </div>

    <!-- 4. 캐릭터 선택 그리드 (랜덤 배치 + PC/태블릿 열 조절) -->
    <div class="grid-section-label">
      <div class="grid-label-left">
        <span>캐릭터 선택</span>
        <div class="layout-controls" id="layoutControls" aria-label="캐릭터 배열 조정">
          <button type="button" class="layout-btn" data-cols="3">3열</button>
          <button type="button" class="layout-btn" data-cols="4">4열</button>
          <button type="button" class="layout-btn active" data-cols="6">6열</button>
          <button type="button" class="layout-btn" data-cols="8">8열</button>
        </div>
      </div>
      <div class="grid-label-right">
        <span id="selectedHint">0 / 24 선택됨</span>
        <button class="btn-shuffle" id="shuffleGridBtn" type="button">🔀 섞기</button>
      </div>
    </div>
    <main class="character-grid" id="characterGrid"></main>
  </div>

  <script>
    const TOTAL_CHARACTERS = 24;
    const selectedIds = new Set();
    let orderMap = new Map();
    let toastTimer = null;
    let soundEnabled = true;
    let desktopCols = 6; // PC/태블릿 기본 6열 (사용자 조정 가능)

    const characterGrid = document.getElementById('characterGrid');
    const resultBody = document.getElementById('resultBody');
    const resultCount = document.getElementById('resultCount');
    const selectedHint = document.getElementById('selectedHint');
    const drawBtn = document.getElementById('drawBtn');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const resetBtn = document.getElementById('resetBtn');
    const shuffleGridBtn = document.getElementById('shuffleGridBtn');
    const soundToggle = document.getElementById('soundToggle');
    const layoutControls = document.getElementById('layoutControls');
    const toastEl = document.getElementById('toast');

    // ===== 반응형 열 개수 동기화 (모바일 3열 고정, PC/태블릿 조정 가능) =====
    function applyGridColumns() {
      const isDesktopOrTablet = window.innerWidth >= 640;
      const cols = isDesktopOrTablet ? desktopCols : 3;
      characterGrid.style.setProperty('--grid-cols', cols);
    }

    layoutControls.addEventListener('click', (e) => {
      const btn = e.target.closest('.layout-btn');
      if (!btn) return;
      desktopCols = Number(btn.dataset.cols);
      layoutControls.querySelectorAll('.layout-btn').forEach((b) => {
        b.classList.toggle('active', b === btn);
      });
      applyGridColumns();
      playClickSound();
    });

    window.addEventListener('resize', applyGridColumns);
    applyGridColumns();

    // ===== Web Audio API 효과음 엔진 =====
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, startTime, duration, type = 'sine', volume = 0.14) {
      const ctx = getAudioCtx();
      if (!ctx || !soundEnabled) return;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);

      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(startTime);
      osc.stop(startTime + duration + 0.02);
    }

    function playSelectSound(isSelected) {
      const ctx = getAudioCtx();
      if (!ctx || !soundEnabled) return;
      const now = ctx.currentTime;

      if (isSelected) {
        playTone(587.33, now, 0.09, 'sine', 0.14);
        playTone(880.0, now + 0.055, 0.12, 'triangle', 0.12);
      } else {
        playTone(523.25, now, 0.08, 'sine', 0.1);
        playTone(392.0, now + 0.05, 0.1, 'sine', 0.08);
      }
    }

    function playResultFanfare() {
      const ctx = getAudioCtx();
      if (!ctx || !soundEnabled) return;
      const now = ctx.currentTime;

      const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      notes.forEach((freq, idx) => {
        playTone(freq, now + idx * 0.065, 0.24, 'triangle', 0.15);
      });

      const bufferSize = ctx.sampleRate * 0.12;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.025));
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1800;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.18, now + 0.18);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now + 0.18);
    }

    function playClickSound(isReset = false) {
      const ctx = getAudioCtx();
      if (!ctx || !soundEnabled) return;
      const now = ctx.currentTime;
      if (isReset) {
        playTone(440, now, 0.08, 'sine', 0.1);
        playTone(330, now + 0.06, 0.12, 'sine', 0.08);
      } else {
        playTone(660, now, 0.08, 'triangle', 0.11);
      }
    }

    soundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
      soundToggle.classList.toggle('muted', !soundEnabled);
      if (soundEnabled) playClickSound();
    });

    const getLetter = (index) => String.fromCharCode(65 + index);

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // 캐릭터 그리드 랜덤 렌더링 (패딩 없음, 번호 없음)
    function renderGrid() {
      characterGrid.innerHTML = '';

      const randomIds = shuffleArray(
        Array.from({ length: TOTAL_CHARACTERS }, (_, idx) => idx + 1)
      );

      randomIds.forEach((id, orderIndex) => {
        const card = document.createElement('div');
        card.className = 'char-card';
        if (selectedIds.has(id)) card.classList.add('selected');
        card.dataset.id = id;

        const skeleton = document.createElement('div');
        skeleton.className = 'skeleton';

        const check = document.createElement('div');
        check.className = 'select-check';
        check.textContent = '✓';

        const img = document.createElement('img');
        img.className = 'char-img';
        img.src = `img/${id}.png`;
        img.alt = `산리오 캐릭터 ${id}`;
        img.loading = 'lazy';

        const fallback = document.createElement('div');
        fallback.className = 'img-fallback';
        fallback.innerHTML = `<span>🎀</span><div>img/${id}.png</div>`;

        const staggerDelay = (orderIndex + 1) * 30;

        const revealImage = () => {
          setTimeout(() => {
            skeleton.classList.add('hidden');
            img.classList.add('loaded');
          }, staggerDelay);
        };

        const revealFallback = () => {
          setTimeout(() => {
            skeleton.classList.add('hidden');
            img.style.display = 'none';
            fallback.style.display = 'flex';
          }, staggerDelay);
        };

        img.addEventListener('load', revealImage);
        img.addEventListener('error', revealFallback);

        if (img.complete) {
          if (img.naturalWidth > 0) revealImage();
          else revealFallback();
        }

        card.append(skeleton, check, img, fallback);

        if (orderMap.has(id)) {
          const badge = document.createElement('div');
          badge.className = 'order-badge';
          badge.textContent = orderMap.get(id);
          card.appendChild(badge);
        }

        card.addEventListener('click', () => toggleSelect(id, card));
        characterGrid.appendChild(card);
      });
    }

    function toggleSelect(id, cardEl) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
        cardEl.classList.remove('selected');
        playSelectSound(false);
      } else {
        selectedIds.add(id);
        cardEl.classList.add('selected');
        playSelectSound(true);
      }
      updateUIState();
    }

    function updateUIState() {
      const count = selectedIds.size;
      resultCount.textContent = `선택 ${count}명`;
      selectedHint.textContent = `${count} / ${TOTAL_CHARACTERS} 선택됨`;
      drawBtn.disabled = count < 1;
      selectAllBtn.textContent = count === TOTAL_CHARACTERS ? '해제' : '전체';
    }

    function updateGridBadges() {
      document.querySelectorAll('.char-card').forEach((card) => {
        const existingBadge = card.querySelector('.order-badge');
        if (existingBadge) existingBadge.remove();

        const id = Number(card.dataset.id);
        if (orderMap.has(id)) {
          const badge = document.createElement('div');
          badge.className = 'order-badge';
          badge.textContent = orderMap.get(id);
          card.appendChild(badge);
        }
      });
    }

    // 상단 결과 카드 렌더링 (가로 중앙 정렬 + 2x2 비율)
    function renderResults(shuffledIds) {
      const grid = document.createElement('div');
      grid.className = 'result-grid';

      shuffledIds.forEach((id, idx) => {
        const letter = getLetter(idx);
        const card = document.createElement('div');
        card.className = 'result-card';
        card.style.animationDelay = `${idx * 60}ms`;

        const badge = document.createElement('div');
        badge.className = 'order-badge';
        badge.textContent = letter;

        const img = document.createElement('img');
        img.src = `img/${id}.png`;
        img.alt = `${letter}번 산리오 캐릭터`;
        img.onerror = () => {
          img.style.display = 'none';
          const fb = document.createElement('div');
          fb.style.fontSize = '22px';
          fb.textContent = '🎀';
          card.appendChild(fb);
        };

        card.append(badge, img);
        grid.appendChild(card);
      });

      resultBody.innerHTML = '';
      resultBody.appendChild(grid);
    }

    function showToast(message) {
      toastEl.textContent = `🎉 ${message}`;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2800);
    }

    // 순서 뽑기 실행
    drawBtn.addEventListener('click', () => {
      if (selectedIds.size === 0) return;

      const shuffled = shuffleArray(Array.from(selectedIds));
      orderMap.clear();
      shuffled.forEach((id, idx) => {
        orderMap.set(id, getLetter(idx));
      });

      renderResults(shuffled);
      updateGridBadges();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      playResultFanfare();
      launchConfetti();
      showToast('순서뽑기 결과가 나왔습니다.');
    });

    // 전체 선택 / 해제
    selectAllBtn.addEventListener('click', () => {
      const cards = document.querySelectorAll('.char-card');
      if (selectedIds.size === TOTAL_CHARACTERS) {
        selectedIds.clear();
        cards.forEach((c) => c.classList.remove('selected'));
        playSelectSound(false);
      } else {
        cards.forEach((c) => {
          const id = Number(c.dataset.id);
          selectedIds.add(id);
          c.classList.add('selected');
        });
        playSelectSound(true);
      }
      updateUIState();
    });

    // 그리드 사진 순서 다시 섞기
    shuffleGridBtn.addEventListener('click', () => {
      playClickSound();
      renderGrid();
    });

    // 초기화
    resetBtn.addEventListener('click', () => {
      selectedIds.clear();
      orderMap.clear();
      resultBody.innerHTML = '<div class="result-empty">아래에서 캐릭터를 선택한 뒤 <b>순서 뽑기</b>를 눌러주세요.</div>';
      renderGrid();
      updateUIState();
      playClickSound(true);
    });

    // ===== 컨페티 애니메이션 =====
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confettiParticles = [];
    let confettiAnimId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function launchConfetti() {
      const colors = ['#FF7898', '#82DC28', '#FFD166', '#6EC6FF', '#C78BFF', '#FF9F68'];
      confettiParticles = Array.from({ length: 95 }, () => ({
        x: canvas.width * (0.2 + Math.random() * 0.6),
        y: canvas.height * 0.18,
        vx: (Math.random() - 0.5) * 11,
        vy: -Math.random() * 10 - 3,
        size: 6 + Math.random() * 6,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rotationSpeed: (Math.random() - 0.5) * 12,
        gravity: 0.28,
        opacity: 1
      }));

      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let activeCount = 0;

      confettiParticles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.vx *= 0.99;
        p.rotation += p.rotationSpeed;
        if (p.y > canvas.height * 0.72) p.opacity -= 0.025;

        if (p.opacity > 0 && p.y < canvas.height + 20) {
          activeCount++;
          ctx.save();
          ctx.globalAlpha = Math.max(p.opacity, 0);
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rotation * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
          ctx.restore();
        }
      });

      if (activeCount > 0) {
        confettiAnimId = requestAnimationFrame(animateConfetti);
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    renderGrid();
    updateUIState();
  </script>
</body>
</html>
