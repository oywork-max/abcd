<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#86CEFA">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>휴게시간 순서뽑기 - 호빵맨 테마 (47인)</title>

    <!-- 스플래시 강제 종료 안전장치 (1.3초 후 무조건 DOM에서 삭제) -->
    <script>
        function forceRemoveSplash() {
            var splash = document.getElementById('anpanSplash');
            if (!splash) return;
            splash.style.opacity = '0';
            splash.style.pointerEvents = 'none';
            setTimeout(function() {
                if (splash && splash.parentNode) {
                    splash.parentNode.removeChild(splash);
                }
            }, 350);
        }
        setTimeout(forceRemoveSplash, 1300);
        window.addEventListener('DOMContentLoaded', function() {
            setTimeout(forceRemoveSplash, 1200);
        });
    </script>

    <!-- Pretendard & 둥근 타이틀용 Jua 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-bg: #86CEFA;
            --anpan-red: #E53935;
            --anpan-red-dark: #B71C1C;
            --anpan-yellow: #FFEB3B;
            --anpan-brown: #4A2C11;
            --anpan-cream: #FFFDF7;
            --anpan-cheek: #FF7043;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            background-color: var(--sky-bg);
            color: var(--anpan-brown);
            height: 100%;
            width: 100%;
            max-width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* 모바일 컨테이너 */
        .mobile-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: linear-gradient(180deg, #86CEFA 0%, #98D6FC 60%, #86CEFA 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(0,0,0,0.45);
        }

        /* =========================================================
           1. 인트로 스플래시 화면
           ========================================================= */
        .anpan-splash {
            position: absolute;
            inset: 0;
            background-color: #86CEFA;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.35s ease;
            opacity: 1;
            cursor: pointer;
        }

        .anpan-splash img {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            z-index: 2;
        }

        .splash-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #86CEFA;
            z-index: 1;
            text-align: center;
            padding: 20px;
        }

        .splash-fallback-title {
            font-family: 'Jua', sans-serif;
            font-size: 2.6rem;
            color: var(--anpan-red);
            text-shadow: -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 3px 3px 0 #fff, 0 5px 0 var(--anpan-brown);
            margin-bottom: 12px;
        }

        .splash-touch-hint {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 34px);
            background: rgba(255, 255, 255, 0.94);
            color: var(--anpan-brown);
            border: 2.5px solid var(--anpan-brown);
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 800;
            box-shadow: 0 3px 0 var(--anpan-brown);
            z-index: 5;
        }

        /* =========================================================
           2. 호빵맨 테마 배경 장식 (무지개 아치 + 별 패턴 SVG)
           ========================================================= */
        .theme-bg-decor {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* 상단 헤더 */
        header {
            padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
            padding-bottom: 10px;
            padding-left: 14px;
            padding-right: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 253, 247, 0.94);
            backdrop-filter: blur(8px);
            border-bottom: 3px solid var(--anpan-brown);
            box-shadow: 0 3px 0 rgba(74, 44, 17, 0.14);
            z-index: 20;
            flex-shrink: 0;
        }

        .nav-btn {
            background: #ffffff;
            border: 2px solid var(--anpan-brown);
            box-shadow: 0 2.5px 0 var(--anpan-brown);
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--anpan-brown);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            transition: all 0.12s ease;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--anpan-brown);
        }

        .header-title {
            font-family: 'Jua', sans-serif;
            font-size: 1.18rem;
            color: var(--anpan-red);
            text-shadow: -1.5px -1.5px 0 #fff, 1.5px -1.5px 0 #fff, -1.5px 1.5px 0 #fff, 1.5px 1.5px 0 #fff, 0 2px 0 var(--anpan-brown);
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .cheek-dots {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        .cheek-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--anpan-cheek);
            border: 1.5px solid var(--anpan-brown);
        }
        .cheek-dots span:nth-child(2) {
            width: 9px;
            height: 9px;
            background: var(--anpan-red);
        }

        .sound-btn {
            background: var(--anpan-yellow);
            border: 2px solid var(--anpan-brown);
            box-shadow: 0 2.5px 0 var(--anpan-brown);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.12s ease;
        }

        .sound-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--anpan-brown);
        }

        /* 명대사 플로팅 말풍선 배너 */
        .quote-toast {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 60px);
            left: 50%;
            transform: translateX(-50%) translateY(-15px) scale(0.95);
            width: calc(100% - 24px);
            background: #ffffff;
            border: 2.5px solid var(--anpan-brown);
            border-radius: 16px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 0 var(--anpan-brown), 0 8px 18px rgba(0, 0, 0, 0.2);
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .quote-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .quote-speaker {
            background: var(--anpan-red);
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 999px;
            border: 1.5px solid var(--anpan-brown);
            white-space: nowrap;
        }

        .quote-text {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--anpan-brown);
            line-height: 1.25;
            word-break: keep-all;
        }

        /* 페이지 레이어 */
        .page {
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        .page.hidden {
            display: none !important;
        }

        /* 컨텐츠 스크롤 영역 */
        .content-scroll {
            flex: 1;
            min-height: 0;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 12px 12px 150px 12px;
        }

        /* 4x12 격자 그리드 (좌우 잘림 방지) */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            width: 100%;
            margin: 0 auto;
        }

        /* [수정] 캐릭터 카드: 적당한 기본 패딩(5px)과 안정적인 비율로 복원 */
        .char-card {
            width: 100%;
            min-width: 0;
            background: #ffffff;
            border-radius: 14px;
            aspect-ratio: 1 / 1.12;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 5px 5px 4px 5px;
            cursor: pointer;
            position: relative;
            border: 2px solid var(--anpan-brown);
            box-shadow: 0 3px 0 var(--anpan-brown), 0 4px 8px rgba(0, 0, 0, 0.12);
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .char-card:active {
            transform: translateY(2px) scale(0.96);
            box-shadow: 0 1px 0 var(--anpan-brown);
        }

        .char-card.selected {
            background: #fffde7;
            border-color: var(--anpan-red);
            box-shadow: 0 3px 0 var(--anpan-red-dark), 0 0 0 2.5px var(--anpan-yellow);
            transform: translateY(-2px);
        }

        /* 좌측 상단 번호 미니 태그 */
        .char-num-tag {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(74, 44, 17, 0.72);
            color: #ffffff;
            font-size: 0.5rem;
            font-weight: 800;
            padding: 1px 4px;
            border-radius: 4px;
            z-index: 3;
            pointer-events: none;
            line-height: 1.1;
        }

        /* 선택 체크 뱃지 */
        .select-check {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 19px;
            height: 19px;
            border-radius: 50%;
            background: var(--anpan-red);
            color: #ffffff;
            border: 1.5px solid #ffffff;
            outline: 1.5px solid var(--anpan-brown);
            font-size: 0.62rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.4);
            transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 4;
        }

        .char-card.selected .select-check {
            opacity: 1;
            transform: scale(1);
        }

        /* [핵심 수정] 이미지 확대/크롭(cover)을 삭제하고 캐릭터 전체가 눈 잘림 없이 온전히 나오는 contain 적용 */
        .char-img-box {
            width: 100%;
            height: 76%;
            border-radius: 9px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            background: #ffffff;
        }

        .char-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 이미지가 절대 잘리지 않고 원본 비율 그대로 표시됨 */
            object-position: center;
            display: block;
        }

        .char-name {
            font-size: 0.64rem;
            font-weight: 900;
            color: var(--anpan-brown);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            line-height: 1.2;
            letter-spacing: -0.04em;
        }

        /* 결과 화면 우측 상단 알파벳 배지 */
        @keyframes badgeBounceIn {
            0%   { opacity: 0; transform: scale(0.2) translateY(-20px); }
            50%  { opacity: 1; transform: scale(1.22) translateY(2px); }
            75%  { transform: scale(0.92) translateY(-2px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .result-badge {
            position: absolute;
            top: -5px;
            right: -4px;
            background: linear-gradient(135deg, #ff5252 0%, #d32f2f 100%);
            color: #ffffff;
            min-width: 25px;
            height: 25px;
            padding: 0 4px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Jua', sans-serif;
            font-size: 0.82rem;
            box-shadow: 0 2px 0 var(--anpan-brown), 0 3px 6px rgba(229, 57, 53, 0.45);
            border: 1.5px solid #ffffff;
            outline: 1.5px solid var(--anpan-brown);
            z-index: 6;
            opacity: 0;
            animation: badgeBounceIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* 하단 고정 액션 영역 */
        .footer-action {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 14px calc(env(safe-area-inset-bottom, 0px) + 16px) 14px;
            background: linear-gradient(to top, rgba(134, 206, 250, 0.98) 65%, rgba(134, 206, 250, 0));
            display: flex;
            gap: 8px;
            justify-content: center;
            z-index: 10;
        }

        .action-btn {
            flex: 1;
            background: var(--anpan-red);
            color: #ffffff;
            border: 2.5px solid var(--anpan-brown);
            border-radius: 16px;
            padding: 14px 12px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--anpan-brown), 0 6px 14px rgba(0, 0, 0, 0.2);
            transition: all 0.15s ease;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--anpan-brown);
        }

        .action-btn.home-sub-btn {
            flex: 0.45;
            background: #ffffff;
            color: var(--anpan-brown);
            box-shadow: 0 4px 0 var(--anpan-brown);
        }

        .action-btn.retry-main-btn {
            flex: 0.55;
            background: var(--anpan-yellow);
            color: var(--anpan-brown);
            box-shadow: 0 4px 0 var(--anpan-brown);
        }

        /* 바텀시트 모달 */
        .bottom-sheet-overlay {
            position: absolute;
            inset: 0;
            background: rgba(30, 41, 59, 0.55);
            backdrop-filter: blur(3px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .bottom-sheet-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            width: 100%;
            background: var(--anpan-cream);
            border-top: 3.5px solid var(--anpan-brown);
            border-top-left-radius: 26px;
            border-top-right-radius: 26px;
            padding: 20px 20px calc(env(safe-area-inset-bottom, 0px) + 28px) 20px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            text-align: center;
            box-shadow: 0 -8px 25px rgba(0,0,0,0.2);
        }

        .bottom-sheet-overlay.active .bottom-sheet {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 44px;
            height: 5px;
            background: var(--anpan-brown);
            border-radius: 3px;
            margin: 0 auto 14px auto;
            opacity: 0.3;
        }

        .sheet-msg {
            font-size: 1.12rem;
            font-weight: 900;
            color: var(--anpan-brown);
            margin-bottom: 18px;
        }

        .sheet-confirm-btn {
            width: 100%;
            background: var(--anpan-red);
            color: #ffffff;
            border: 2.5px solid var(--anpan-brown);
            border-radius: 15px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--anpan-brown);
            transition: all 0.15s ease;
        }

        .sheet-confirm-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--anpan-brown);
        }
    </style>
</head>
<body>

    <div class="mobile-container">

        <!-- [1] 호빵맨 인트로 스플래시 화면 -->
        <div class="anpan-splash" id="anpanSplash" onclick="forceRemoveSplash()" ontouchstart="forceRemoveSplash()">
            <img id="splashImgEl" src="anpanman/splash.jpg" alt="날아라 호빵맨 인트로" 
                 onerror="if(!this.dataset.t1){this.dataset.t1=1;this.src='img/splash.jpg';}else if(!this.dataset.t2){this.dataset.t2=1;this.src='anpanman-splash.jpg';}else if(!this.dataset.t3){this.dataset.t3=1;this.src='splash.jpg';}else{this.style.display='none';}">
            
            <div class="splash-fallback">
                <div style="font-family:'Jua',sans-serif; font-size:1.4rem; color:#FFEB3B; text-shadow: -2px -2px 0 #4A2C11, 2px -2px 0 #4A2C11, -2px 2px 0 #4A2C11, 2px 2px 0 #4A2C11; margin-bottom:4px;">날아라!</div>
                <div class="splash-fallback-title">호빵맨</div>
            </div>

            <div class="splash-touch-hint">✨ 화면을 터치하면 바로 시작합니다</div>
        </div>

        <!-- [2] 배경 (스카이블루 + 무지개 아치 + 별 장식) -->
        <svg class="theme-bg-decor" viewBox="0 0 480 900" preserveAspectRatio="none">
            <g stroke="#4A2C11" stroke-width="2.5" stroke-linejoin="round">
                <polygon points="75,95 82,110 98,112 86,123 89,139 75,131 61,139 64,123 52,112 68,110" fill="#FFEB3B"/>
                <polygon points="42,165 46,174 56,175 49,182 51,192 42,187 33,192 35,182 28,175 38,174" fill="#FFEB3B"/>
                <polygon points="65,235 72,248 86,250 76,260 78,274 65,267 52,274 54,260 44,250 58,248" fill="#FF8A65"/>
                <polygon points="35,310 42,324 57,326 46,337 49,352 35,344 21,352 24,337 13,326 28,324" fill="#FFEB3B"/>
                <polygon points="395,105 402,118 416,120 406,130 408,144 395,137 382,144 384,130 374,120 388,118" fill="#FF8A65"/>
                <polygon points="435,155 441,167 454,169 444,178 447,191 435,184 423,191 426,178 416,169 429,167" fill="#FFEB3B"/>
                <polygon points="440,245 447,258 461,260 451,270 453,284 440,277 427,284 429,270 419,260 433,258" fill="#FF8A65"/>
                <polygon points="415,320 422,334 437,336 426,347 429,362 415,354 401,362 404,347 393,336 408,334" fill="#FFEB3B"/>
            </g>

            <g opacity="0.92">
                <path d="M-40,560 Q240,690 520,560 L520,900 L-40,900 Z" fill="#8C62AA"/>
                <path d="M-40,605 Q240,735 520,605 L520,900 L-40,900 Z" fill="#68B85D"/>
                <path d="M-40,650 Q240,780 520,650 L520,900 L-40,900 Z" fill="#FFF100"/>
                <path d="M-40,695 Q240,825 520,695 L520,900 L-40,900 Z" fill="#F39800"/>
                <path d="M-40,740 Q240,870 520,740 L520,900 L-40,900 Z" fill="#E60012"/>
                <path d="M-40,785 Q240,915 520,785 L520,900 L-40,900 Z" fill="#86CEFA"/>
            </g>

            <g stroke="#4A2C11" stroke-width="2.5" stroke-linejoin="round">
                <polygon points="55,815 62,828 76,830 66,840 68,854 55,847 42,854 44,840 34,830 48,828" fill="#FF8A65"/>
                <polygon points="390,805 398,821 415,823 403,835 406,852 390,843 374,852 377,835 365,823 382,821" fill="#FFEB3B"/>
                <polygon points="445,780 451,792 464,794 454,803 457,816 445,809 433,816 436,803 426,794 439,792" fill="#FFEB3B"/>
            </g>
        </svg>

        <!-- 상단 헤더 -->
        <header>
            <button class="nav-btn" onclick="navigateHome()">🏠 홈</button>
            <div class="header-title">
                <span class="cheek-dots"><span></span><span></span><span></span></span>
                <span id="headerTitle">호빵맨 순서뽑기</span>
            </div>
            <button class="sound-btn" id="soundToggleBtn" onclick="toggleSound()" title="음성/효과음 켜기·끄기">🔊</button>
        </header>

        <!-- 캐릭터 명대사 플로팅 토스트 -->
        <div class="quote-toast" id="quoteToast">
            <span class="quote-speaker" id="quoteSpeaker">호빵맨</span>
            <span class="quote-text" id="quoteText">"힘내라! 내 얼굴을 먹어!"</span>
        </div>

        <!-- [페이지 1] 캐릭터 선택 화면 (4x12 배열, 1~47번) -->
        <div class="page" id="selectPage">
            <div class="content-scroll">
                <div class="character-grid" id="anpanmanGrid"></div>
            </div>
            <div class="footer-action">
                <button class="action-btn" id="selectActionBtn" onclick="openBottomSheet()">🍞 선택하기</button>
            </div>
        </div>

        let selectedIds = [];
        let soundEnabled = true;
        let quoteTimer = null;
        let audioCtx = null;

        function createFallbackSVG(bgColor) {
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <rect width="100" height="100" fill="${bgColor}"/>
                <circle cx="50" cy="52" r="34" fill="#FCD3A1" stroke="#4A2C11" stroke-width="3.5"/>
                <circle cx="33" cy="55" r="7.5" fill="#FF7043"/>
                <circle cx="67" cy="55" r="7.5" fill="#FF7043"/>
                <circle cx="50" cy="53" r="8" fill="#E53935" stroke="#4A2C11" stroke-width="2.2"/>
                <circle cx="39" cy="41" r="4" fill="#4A2C11"/>
                <circle cx="61" cy="41" r="4" fill="#4A2C11"/>
                <path d="M 38 66 Q 50 75 62 66" fill="none" stroke="#4A2C11" stroke-width="3.2" stroke-linecap="round"/>
            </svg>`;
            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        function bindCharacterImage(imgEl, id, bgColor) {
            const paths = [
                `anpanman/${id}.png`,
                `img/${id}.png`,
                `${id}.png`,
                `anpanman/${id}.jpg`,
                `img/${id}.jpg`
            ];
            let idx = 0;
            imgEl.onerror = function() {
                idx++;
                if (idx < paths.length) {
                    imgEl.src = paths[idx];
                } else {
                    imgEl.onerror = null;
                    imgEl.src = createFallbackSVG(bgColor);
                }
            };
            imgEl.src = paths[0];
        }

        function getOrderLabel(index) {
            if (index < 26) {
                return String.fromCharCode(65 + index);
            }
            const first = String.fromCharCode(65 + Math.floor(index / 26) - 1);
            const second = String.fromCharCode(65 + (index % 26));
            return first + second;
        }

        function navigateHome() {
            const path = window.location.pathname;
            if (path.includes('/anpanman/')) {
                window.location.href = '../index.html';
            } else {
                window.location.href = 'index.html';
            }
        }

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playChime(type = 'select') {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'select') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.12);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                osc.start(now);
                osc.stop(now + 0.18);
            } else if (type === 'fanfare') {
                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + idx * 0.08);
                    g.gain.setValueAtTime(0.16, now + idx * 0.08);
                    g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.22);
                    o.start(now + idx * 0.08);
                    o.stop(now + idx * 0.08 + 0.22);
                });
            }
        }

        function triggerCharacterQuote(char) {
            const toast = document.getElementById('quoteToast');
            const speaker = document.getElementById('quoteSpeaker');
            const text = document.getElementById('quoteText');

            speaker.innerText = char.name;
            text.innerText = `"${char.quote}"`;
            toast.classList.add('show');

            if (quoteTimer) clearTimeout(quoteTimer);
            quoteTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2600);

            if (soundEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(char.quote);
                utter.lang = 'ko-KR';
                utter.pitch = char.pitch || 1.0;
                utter.rate = char.rate || 1.0;
                window.speechSynthesis.speak(utter);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggleBtn');
            btn.innerText = soundEnabled ? '🔊' : '🔇';
            if (!soundEnabled && 'speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function initGridOnce() {
            const grid = document.getElementById('anpanmanGrid');
            if (!grid) return;
            grid.innerHTML = '';

            anpanmanCharacters.forEach(char => {
                const card = document.createElement('div');
                card.className = 'char-card';
                card.id = `char-card-${char.id}`;
                card.onclick = () => toggleSelect(char);

                card.innerHTML = `
                    <div class="char-num-tag">#${char.id}</div>
                    <div class="select-check">✓</div>
                    <div class="char-img-box" style="background-color: ${char.bg};">
                        <img alt="${char.name}">
                    </div>
                    <div class="char-name">${char.name}</div>
                `;
                grid.appendChild(card);

                const imgEl = card.querySelector('img');
                bindCharacterImage(imgEl, char.id, char.bg);
            });
        }

        function updateSelectionUI() {
            anpanmanCharacters.forEach(char => {
                const card = document.getElementById(`char-card-${char.id}`);
                if (!card) return;
                if (selectedIds.includes(char.id)) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });

            const btn = document.getElementById('selectActionBtn');
            if (btn) {
                btn.innerText = selectedIds.length > 0 ? `🍞 선택하기 (${selectedIds.length}명)` : `🍞 선택하기`;
            }
        }

        function toggleSelect(char) {
            if (selectedIds.includes(char.id)) {
                selectedIds = selectedIds.filter(item => item !== char.id);
            } else {
                selectedIds.push(char.id);
                playChime('select');
                triggerCharacterQuote(char);
            }
            updateSelectionUI();
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function openBottomSheet() {
            if (selectedIds.length === 0) {
                alert('최소 1명 이상의 캐릭터를 선택해주세요!');
                return;
            }
            document.getElementById('sheetMsg').innerText = `${selectedIds.length}명의 캐릭터 선택하였습니다.`;
            document.getElementById('bottomSheetOverlay').classList.add('active');
        }

        function closeBottomSheet(e) {
            if (e && e.target.id === 'bottomSheetOverlay') {
                document.getElementById('bottomSheetOverlay').classList.remove('active');
            }
        }

        function confirmSelection() {
            document.getElementById('bottomSheetOverlay').classList.remove('active');
            playChime('fanfare');

            const selectPage = document.getElementById('selectPage');
            const resultPage = document.getElementById('resultPage');
            const headerTitle = document.getElementById('headerTitle');

            selectPage.classList.add('hidden');
            headerTitle.innerText = '휴게시간 순서 결과';

            renderResultGrid();
            resultPage.classList.remove('hidden');
        }

        function renderResultGrid() {
            const resultGrid = document.getElementById('resultGrid');
            resultGrid.innerHTML = '';

            const labels = selectedIds.map((_, idx) => getOrderLabel(idx));
            const shuffledLabels = shuffleArray(labels);

            selectedIds.forEach((id, index) => {
                const char = anpanmanCharacters.find(c => c.id === id);
                const badgeLetter = shuffledLabels[index];
                const delay = (index * 0.05).toFixed(2);

                const card = document.createElement('div');
                card.className = 'char-card selected';
                card.onclick = () => triggerCharacterQuote(char);
                card.innerHTML = `
                    <div class="char-num-tag">#${char.id}</div>
                    <div class="result-badge" style="animation-delay: ${delay}s">${badgeLetter}</div>
                    <div class="char-img-box" style="background-color: ${char.bg};">
                        <img alt="${char.name}">
                    </div>
                    <div class="char-name">${char.name}</div>
                `;
                resultGrid.appendChild(card);

                const imgEl = card.querySelector('img');
                bindCharacterImage(imgEl, char.id, char.bg);
            });
        }

        function goBack() {
            const selectPage = document.getElementById('selectPage');
            const resultPage = document.getElementById('resultPage');
            const headerTitle = document.getElementById('headerTitle');

            resultPage.classList.add('hidden');
            headerTitle.innerText = '호빵맨 순서뽑기';
            selectPage.classList.remove('hidden');
        }

        initGridOnce();
    </script>
