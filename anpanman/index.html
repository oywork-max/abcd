<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#86CEFA">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>휴게시간 순서뽑기 - 호빵맨 테마 (47인)</title>
    <!-- Pretendard & 둥근 타이틀용 Jua 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-bg: #86CEFA;
            --anpan-red: #E53935;
            --anpan-red-dark: #B71C1C;
            --anpan-yellow: #FFEB3B;
            --anpan-brown: #4A2C11;
            --anpan-cream: #FFFDF7;
            --anpan-cheek: #FF7043;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            background-color: var(--sky-bg);
            color: var(--anpan-brown);
            height: 100%;
            width: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* 모바일 컨테이너: 스플래시 이미지와 통일된 스카이블루 + 무지개 테마 배경 */
        .mobile-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: linear-gradient(180deg, #86CEFA 0%, #98D6FC 60%, #86CEFA 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(0,0,0,0.45);
        }

        /* =========================================================
           1. 인트로 스플래시 화면 (접속 시 먼저 표시 후 페이드아웃)
           ========================================================= */
        .anpan-splash {
            position: absolute;
            inset: 0;
            background-color: #86CEFA;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.65s ease, transform 0.65s ease;
            opacity: 1;
            cursor: pointer;
        }

        .anpan-splash.fade-out {
            opacity: 0;
            transform: scale(1.04);
            pointer-events: none;
        }

        .anpan-splash img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .splash-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #86CEFA;
            z-index: -1;
            text-align: center;
            padding: 20px;
        }

        .splash-fallback-title {
            font-family: 'Jua', sans-serif;
            font-size: 2.6rem;
            color: var(--anpan-red);
            text-shadow: -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 3px 3px 0 #fff, 0 5px 0 var(--anpan-brown);
            margin-bottom: 12px;
            animation: bounceTitle 1.2s ease infinite alternate;
        }

        @keyframes bounceTitle {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        .splash-touch-hint {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 34px);
            background: rgba(255, 255, 255, 0.92);
            color: var(--anpan-brown);
            border: 2.5px solid var(--anpan-brown);
            padding: 7px 18px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 800;
            box-shadow: 0 3px 0 var(--anpan-brown);
        }

        /* =========================================================
           2. 호빵맨 테마 배경 장식 (무지개 아치 + 별 패턴 SVG)
           ========================================================= */
        .theme-bg-decor {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* 상단 헤더 (배터리 영역 safe-area 지원) */
        header {
            padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
            padding-bottom: 12px;
            padding-left: 16px;
            padding-right: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 253, 247, 0.94);
            backdrop-filter: blur(8px);
            border-bottom: 3.5px solid var(--anpan-brown);
            box-shadow: 0 4px 0 rgba(74, 44, 17, 0.14);
            z-index: 20;
        }

        .nav-btn {
            background: #ffffff;
            border: 2.5px solid var(--anpan-brown);
            box-shadow: 0 3px 0 var(--anpan-brown);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--anpan-brown);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            transition: all 0.12s ease;
        }
