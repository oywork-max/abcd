<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#86CEFA">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>휴게시간 순서뽑기 - 호빵맨 테마 (47인)</title>
    <!-- Pretendard & 둥근 타이틀용 Jua 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-bg: #86CEFA;
            --anpan-red: #E53935;
            --anpan-red-dark: #B71C1C;
            --anpan-yellow: #FFEB3B;
            --anpan-brown: #4A2C11;
            --anpan-cream: #FFFDF7;
            --anpan-cheek: #FF7043;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            background-color: var(--sky-bg);
            color: var(--anpan-brown);
            height: 100%;
            width: 100%;
            max-width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* 모바일 컨테이너: 좌우 잘림 원천 차단 + 스카이블루 & 무지개 배경 */
        .mobile-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: linear-gradient(180deg, #86CEFA 0%, #98D6FC 60%, #86CEFA 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(0,0,0,0.45);
        }

        /* =========================================================
           1. 인트로 스플래시 화면 (CSS + JS 이중 자동 전환 보장)
           ========================================================= */
        @keyframes splashAutoHide {
            0%, 72% {
                opacity: 1;
                transform: scale(1);
                visibility: visible;
            }
            100% {
                opacity: 0;
                transform: scale(1.04);
                visibility: hidden;
                pointer-events: none;
            }
        }

        .anpan-splash {
            position: absolute;
            inset: 0;
            background-color: #86CEFA;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.45s ease, transform 0.45s ease, visibility 0.45s ease;
            opacity: 1;
            visibility: visible;
            cursor: pointer;
            animation: splashAutoHide 2.0s ease forwards;
        }

        .anpan-splash.fade-out {
            opacity: 0 !important;
            transform: scale(1.04) !important;
            visibility: hidden !important;
            pointer-events: none !important;
            animation: none !important;
        }

        .anpan-splash img {
            position: relative;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            z-index: 2;
        }

        .splash-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #86CEFA;
            z-index: 1;
            text-align: center;
            padding: 20px;
        }

        .splash-fallback-title {
            font-family: 'Jua', sans-serif;
            font-size: 2.6rem;
            color: var(--anpan-red);
            text-shadow: -3px -3px 0 #fff, 3px -3px 0 #fff, -3px 3px 0 #fff, 3px 3px 0 #fff, 0 5px 0 var(--anpan-brown);
            margin-bottom: 12px;
            animation: bounceTitle 1.2s ease infinite alternate;
        }

        @keyframes bounceTitle {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        .splash-touch-hint {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 34px);
            background: rgba(255, 255, 255, 0.94);
            color: var(--anpan-brown);
            border: 2.5px solid var(--anpan-brown);
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 800;
            box-shadow: 0 3px 0 var(--anpan-brown);
            z-index: 5;
        }

        /* =========================================================
           2. 호빵맨 테마 배경 장식 (무지개 아치 + 별 패턴 SVG)
           ========================================================= */
        .theme-bg-decor {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        /* 상단 헤더 */
        header {
            padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
            padding-bottom: 10px;
            padding-left: 14px;
            padding-right: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 253, 247, 0.94);
            backdrop-filter: blur(8px);
            border-bottom: 3px solid var(--anpan-brown);
            box-shadow: 0 3px 0 rgba(74, 44, 17, 0.14);
            z-index: 20;
            flex-shrink: 0;
        }

        .nav-btn {
            background: #ffffff;
            border: 2px solid var(--anpan-brown);
            box-shadow: 0 2.5px 0 var(--anpan-brown);
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--anpan-brown);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            transition: all 0.12s ease;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--anpan-brown);
        }

        .header-title {
            font-family: 'Jua', sans-serif;
            font-size: 1.18rem;
            color: var(--anpan-red);
            text-shadow: -1.5px -1.5px 0 #fff, 1.5px -1.5px 0 #fff, -1.5px 1.5px 0 #fff, 1.5px 1.5px 0 #fff, 0 2px 0 var(--anpan-brown);
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .cheek-dots {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }
        .cheek-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--anpan-cheek);
            border: 1.5px solid var(--anpan-brown);
        }
        .cheek-dots span:nth-child(2) {
            width: 9px;
            height: 9px;
            background: var(--anpan-red);
        }

        .sound-btn {
            background: var(--anpan-yellow);
            border: 2px solid var(--anpan-brown);
            box-shadow: 0 2.5px 0 var(--anpan-brown);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.12s ease;
        }

        .sound-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--anpan-brown);
        }

        /* 명대사 플로팅 말풍선 배너 */
        .quote-toast {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 60px);
            left: 50%;
            transform: translateX(-50%) translateY(-15px) scale(0.95);
            width: calc(100% - 24px);
            background: #ffffff;
            border: 2.5px solid var(--anpan-brown);
            border-radius: 16px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 0 var(--anpan-brown), 0 8px 18px rgba(0, 0, 0, 0.2);
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .quote-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .quote-speaker {
            background: var(--anpan-red);
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 999px;
            border: 1.5px solid var(--anpan-brown);
            white-space: nowrap;
        }

        .quote-text {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--anpan-brown);
            line-height: 1.25;
            word-break: keep-all;
        }

        /* [핵심 수정] 페이지 레이어: flex:1 + min-height:0 구조로 46, 47번까지 완벽하게 스크롤 보장 */
        .page {
            flex: 1;
            min-height: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: opacity 0.3s ease;
            opacity: 1;
            z-index: 2;
        }

        .page.hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        /* 컨텐츠 스크롤 영역: 좌우 잘림 방지 & 하단 46, 47번 카드가 버튼 위로 완전히 올라오도록 여유 패딩 150px 부여 */
        .content-scroll {
            flex: 1;
            min-height: 0;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding: 12px 12px 150px 12px;
        }

        /* [핵심 수정] 4x12 격자 그리드 (4열 배치 + minmax(0, 1fr)로 좌우 팽창 원천 차단) */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            width: 100%;
            margin: 0 auto;
        }

        /* [핵심 수정] 캐릭터 카드: 내부 패딩을 3px로 최소화하여 캐릭터 이미지 크기 극대화 */
        .char-card {
            width: 100%;
            min-width: 0;
            background: #ffffff;
            border-radius: 14px;
            aspect-ratio: 1 / 1.08;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 3px 3px 4px 3px; /* 패딩 최소화 */
            cursor: pointer;
            position: relative;
            border: 2px solid var(--anpan-brown);
            box-shadow: 0 3.5px 0 var(--anpan-brown), 0 4px 8px rgba(0, 0, 0, 0.12);
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .char-card:active {
            transform: translateY(2px) scale(0.96);
            box-shadow: 0 1px 0 var(--anpan-brown);
        }

        /* 선택되었을 때: 호빵맨 레드 & 스타 옐로우 하이라이트 */
        .char-card.selected {
            background: #fffde7;
            border-color: var(--anpan-red);
            box-shadow: 0 3.5px 0 var(--anpan-red-dark), 0 0 0 2.5px var(--anpan-yellow);
            transform: translateY(-2px);
        }

        /* 좌측 상단 번호 미니 태그 */
        .char-num-tag {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(74, 44, 17, 0.72);
            color: #ffffff;
            font-size: 0.52rem;
            font-weight: 800;
            padding: 1px 4px;
            border-radius: 5px;
            z-index: 3;
            pointer-events: none;
            line-height: 1.1;
        }

        /* 선택 체크 뱃지 */
        .select-check {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--anpan-red);
            color: #ffffff;
            border: 2px solid #ffffff;
            outline: 1.5px solid var(--anpan-brown);
            font-size: 0.65rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.4);
            transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 4;
        }

        .char-card.selected .select-check {
            opacity: 1;
            transform: scale(1);
        }

        /* 개별 이미지(1.png ~ 47.png) 프레임: 카드 면적의 82%를 꽉 채우도록 확대 */
        .char-img-box {
            width: 100%;
            height: 82%;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }

        .char-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .char-name {
            font-size: 0.66rem;
            font-weight: 900;
            color: var(--anpan-brown);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            line-height: 1.15;
            letter-spacing: -0.04em;
        }

        /* 결과 화면 우측 상단 알파벳 배지 (좌우 잘림 없도록 4열 사이즈에 최적화) */
        @keyframes badgeBounceIn {
            0%   { opacity: 0; transform: scale(0.2) translateY(-20px); }
            50%  { opacity: 1; transform: scale(1.22) translateY(2px); }
            75%  { transform: scale(0.92) translateY(-2px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .result-badge {
            position: absolute;
            top: -6px;
            right: -5px;
            background: linear-gradient(135deg, #ff5252 0%, #d32f2f 100%);
            color: #ffffff;
            min-width: 26px;
            height: 26px;
            padding: 0 4px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Jua', sans-serif;
            font-size: 0.85rem;
            box-shadow: 0 2.5px 0 var(--anpan-brown), 0 3px 6px rgba(229, 57, 53, 0.45);
            border: 2px solid #ffffff;
            outline: 2px solid var(--anpan-
